  features:
    title: Prestaciones
    scenario:
      title: Planificación de escenarios
      description: Modela tu futuro financiero con eventos de vida y condiciones económicas personalizables.
    countries:
      title: Motor fiscal multipaís
      description: Se modelan impuestos locales para varios países. Mira qué ocurre si te mudas a otro país.
    privacy:
      title: Privado por diseño
      description: Los datos de tu escenario permanecen en tu dispositivo. No te pedimos que conectes tu cuenta bancaria. Solo recibimos tu correo electrónico si compras una licencia.
    stress:
      title: Pruebas de estrés
      description: Pon a prueba tu plan financiero frente a caídas del mercado y condiciones económicas adversas.
    likelihood:
      title: Probabilidad de éxito
      description: Comprende la probabilidad de éxito con simulaciones basadas en volatilidad.
    data:
      title: Análisis detallado de datos
      description: Explora en detalle las cifras año por año. Analiza de dónde viene cada número.
  howItWorks:
    title: Cómo usarlo
    input:
      number: '1'
      title: Introduce tus datos financieros
      description: Introduce tu situación financiera actual, tus objetivos y las tu estimación de las condiciones económicas futuras. Recibe ayuda detallada para cada campo. Todo permanece en tu navegador. Una guía interactiva te ayuda a empezar.
    events:
      number: '2'
      title: Añade eventos de vida
      description: Crea eventos de ingresos, gastos y cambios importantes de vida, como comprar una vivienda o cambiar de empleo. Hay un asistente para ayudarte a crearlos.
    simulate:
      number: '3'
      title: Ejecuta la simulación
      description: Mira cómo podría evolucionar tu futuro financiero mediante gráficos detallados y desgloses año por año. Obtén una vista general o profundiza en los números.
    compare:
      number: '4'
      title: Cambia una cosa y compara
      description: Ajusta supuestos, guarda versiones, ve dónde es más probable que falle tu plan y aprende qué decisiones realmente cambian el resultado.
  about:
    title: Autor
    developer: Soy desarrollador de software, con pasión por la educación financiera y una inquietud personal que necesitaba resolver.
    motivation: Cuando empecé mi camino como inversor, contraté a un asesor financiero que me dio buenos consejos y una visión de mi futuro financiero con buenos gráficos y datos. Pero el ingeniero que llevo dentro quería jugar con los números y ver cómo afectaban al resultado.
    historyBeforeLink: Primero creé una hoja de cálculo de Google y
    historyLink: la compartí en reddit
    historyAfterLink: ', pero cada vez que hacía un cambio obligaba a los usuarios a crear una copia nueva y volver a introducir sus datos. Así que la convertí en este sitio web.'
    access: Creo que todo el mundo debería tener acceso a herramientas que le ayuden a mejorar su comprensión financiera para mantener conversaciones más productivas con asesores profesionales.
    hope: Espero que esta herramienta te ayude tanto como me ayudó a mí.
  callToAction:
    title: ¿Listo para explorar tu futuro financiero?
    action: Abrir simulador
  disclaimer:
    label: 'Solo con fines educativos:'
    text: Esto no es una herramienta de presupuesto ni asesoramiento financiero, de inversión, fiscal o legal. No tomes decisiones importantes de vida basándote en esto. No sustituye a un buen asesor financiero.
