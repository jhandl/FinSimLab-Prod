      side: "right"
      align: "start"

  - element: "#OldestChildBorn"
    tours: [full, mini]
    card: personalCircumstances
    popover:
      description: "<p>The year that your oldest child was born or is expected or speculated to be born.</p><p>Your income tax band limits may increase if you have dependent children, starting when your first child is born.</p>"
      side: "right"
      align: "start"

  - element: "#YoungestChildBorn"
    tours: [full, mini]
    card: personalCircumstances
