WizardSteps:

  - element: "header"
    tours: [quick, full]
    popover:
      contentType: bullets
      content:
        description: "Main action buttons:"
        items:
          - title: "Run"
            description: "calculate projections"
          - title: "Result"
            description: "get plain-English insights"
          - title: "Save"
            description: "store your scenario to a file"
          - title: "Load"
            description: "reopen a saved scenario"
          - title: "New"
            description: "start a fresh scenario"
          - title: "Help"
            description: "get a tour or assistance for a field"
        footnote: "On small screens some of these move into the ☰ menu."
      showButtons: ["next", "close"]
      side: "bottom"
      align: "center"

  - element: "#progress"
    tours: [full]
    popover:
      contentType: bullets
      content:
        description: "The outcome of the simulation will be shown here."
        items:
          - title: "Linear Growth"
            description: "if you specified linear growth rates ({icon:chart-line}), this will show either 'Success' or the age at which you ran out of money"
          - title: "With Volatility"
            description: "if you specified some volatility ({icon:chart-variable}), it will show the probability of success of your scenario"
          - title: "Insights"
            description: "After every simulation, a small ⓘ appears in this box. Click it for plain-English observations about your results"
      side: "bottom"
      align: "center"

  - element: ".parameters-section"
    tours: [full, quick]
    popover:
      contentType: bullets
      content:
        description: "Parameter panels:"
        items:
          - title: "Enter Information"
            description: "enter your current situation, targets, investment allocations, and economic assumptions"
          - title: "Get Help"
            description: "click the info icons ({icon:info}) for detailed help on any panel or field"
      side: "right"
      align: "start"

  - element: "#startingPosition"
    tours: [full, mini]
    popover:
      contentType: text
      content:
        text: "This is where you describe your current financial situation. It's the starting point for the simulation."
      side: "right"
      align: "start"
    card: startingPosition

  - element: "#simModeSingle"
    tours: [full, mini]
    card: startingPosition
    popover:
      description: "<p>Single person simulation mode.</p><p>Use this mode for individual financial planning. In this mode, you'll only enter your own financial information and the simulator will plan for one person's financial future.</p>"
      side: "right"
      align: "center"

  - element: "#simModeCouple"
    tours: [full, mini]
    card: startingPosition
    popover:
      description: "<p>Two-person simulation mode.</p><p>This allows you to enter separate pension pots, retirement ages, and state pension information for both people.</p><p>Income events can be assigned to either person.</p>"
      side: "right"
      align: "center"
      
  - element: "#StartCountryToggle"
    tours: [full, mini]
    card: startingPosition
    popover:
      description: "<p>Select your current country of residence.</p><p>This sets the active tax rules for calculations. You can add a relocation event to move to another country, and that country's tax rules will then apply.</p>"
      side: "right"
      align: "start"

  - element: "#StartingAge"
    tours: [full, mini]
    card: startingPosition
    popover:
      description: "<p>Enter your current age.</p>"
      side: "right"
      align: "start"
  
  - element: "#P2StartingAge"
    tours: [full, mini]
    card: startingPosition
    popover:
      description: "<p>Enter your partner's current age.</p>"
      side: "right"
      align: "start"
  
  - element: "#InitialSavings"
    tours: [full, mini]
    card: startingPosition
    popover:
