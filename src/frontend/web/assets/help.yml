      align: "start"

  - dynamicInvestmentField: "InvestmentAllocationHolds"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Selects which global instrument <b>${investmentType.label}</b> invests in.</p><p>Use <b>Mix...</b> to split between two instruments over time (fixed mix or glidepath).</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "InvestmentWrapperFee"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Annual wrapper fees reduce expected growth. Default: ${investmentType.defaultFeeText}.</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionContributionHoldsP1"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Selects which global instrument your private pension contributions are invested in.</p><p>Use <b>Mix...</b> to split between two instruments over time (fixed mix or glidepath).</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionContributionHoldsP2"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Selects which global instrument your partner's private pension contributions are invested in.</p><p>Use <b>Mix...</b> to split between two instruments over time (fixed mix or glidepath).</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionWrapperFeeP1"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Annual pension wrapper fees reduce expected growth. Default: ${investmentType.defaultFeeText}.</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionWrapperFeeP2"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Annual pension wrapper fees reduce expected growth. Default: ${investmentType.defaultFeeText}.</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionContribution"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "${investmentType.contributionDescriptionP1}"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionContributionP2"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "${investmentType.contributionDescriptionP2}"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "PensionCapped"
    tours: [full, mini]
    card: Allocations
    popover:
      description: "<p>Limit on your pension contribution. Tax relief applies only up to the annual cap defined in the current tax rules.<ul><li><b>Yes</b>: stop at the ${taxRules.pensionRules.contributionLimits.annualCap,currency} cap (inflation-adjusted).</li><li><b>No</b>: pay tax on amounts above the ${taxRules.pensionRules.contributionLimits.annualCap,currency} cap.</li><li><b>Match</b>: contribute only what your employer matches (e.g. 4% you + 4% employer).</li></ul></p>"
      side: "right"
      align: "start"

  - element: "#drawdownPriorities"
    tours: [full, mini]
    card: drawdownPriorities
    popover:
      description: "<p>Set the withdrawal order of your assets:</p><ul><li>Drag items to reorder; top = used first.</li><li>Priorities matter when covering expenses when income is insufficient (e.g., retirement withdrawals).</li></ul>"
      side: "right"
      align: "start"

  - element: "#growthRates"
    tours: [full, mini]
    card: growthRates
    popover:
      description: "<p>Here is where you speculate how the economy will do on average in the future.</p><p>Use the toggle in the top right to switch between fixed and variable growth modes.</p><p>You may want to enter conservative growth numbers to stress test your scenario.</p>"
      side: "right"
      align: "start"

  - element: "#economyModeDeterministic"
    tours: [full, mini]
    card: growthRates
    popover:
      description: "<p>Fixed growth mode.</p><p>In this mode, the simulation uses fixed growth rates without volatility. This provides a single, predictable outcome based on your specified growth rates. Volatility fields are hidden in this mode.</p>"
      side: "right"
      align: "center"

  - element: "#economyModeMonteCarlo"
    tours: [full, mini]
    card: growthRates
    popover:
      description: "<p>Variable growth mode.</p><p>In this mode, the simulator runs thousands of times using both growth rates and volatility. This provides a probability of success rather than a single outcome, accounting for market uncertainty and fluctuations. At least one of the volatility rates must be greater than 0%.</p>"
      side: "right"
      align: "center"

  - dynamicInvestmentField: "GlobalAssetGrowth"
    tours: [full, mini]
    card: growthRates
    popover:
