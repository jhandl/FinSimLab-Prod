  - id: faq
    title: F.A.Q.
    excludeFromHeightCalculation: true
    contentType: accordion
    content:
      items:
        - question: "Why are the numbers much larger than I expected?"
          answer:
            - "Unless you specify 0 inflation, the numbers will grow year after year at the rate of inflation."
            - "The values you enter into the different fields have to be in terms of present value though. For example, for a property that you expect to purchase 10 years from now, you should enter the current value of the property, not the value you expect it to be worth in 10 years time."
            - "If you prefer to see all values in today's terms without the inflation growth, enable the Present Value toggle in the (☰) menu. This will automatically adjust all displayed amounts for inflation, making them easier to understand and compare."
        - question: "Why are tax credits and limits also inflation adjusted?"
          answer:
            - "Even though some of the tax numbers don't change every year, many generally do, usually the income tax brackets, although that changes from country to country."
            - "I have to assume some periodic adjustment, and inflation is the best proxy I can think of. I'm open to suggestions on how to do this better."
        - question: "What is Present Value display and how do I use it?"
          answer:
            - "Present Value display shows all projected amounts (income, expenses, investments, taxes, etc.) in today's currency terms by adjusting for inflation. This makes it easier to understand what future amounts will actually be worth in real purchasing power."
            - "Instead of seeing inflated nominal amounts (e.g., €500,000 salary in 30 years), you see what that amount is worth in today's terms. This helps you compare values across different years and understand the true impact of your financial decisions."
            - "You can enable Present Value display using the toggle in the (☰) menu. When enabled, all values in the data table and charts are automatically deflated to show their present-value equivalents. Toggle it off to see the original nominal (inflated) values."
            - "Note that the simulation calculations remain the same - only the display changes. Data table CSV export will contain the values currently displayed."
        - question: "Why do I see this unexpected number in the simulation data table?"
          answer:
            - "Many of the table cells have a little 'i' on the lower right corner. That means that the cell has a tooltip attached to it." 
            - "You can hover, click or long-press the cell to see where the number comes from."
        - question: "How do I use the Events table?"
          answer:
            - "Things that have a start date and an end date, like your income, your expenses or buying a property, go into the events table."
            - "Click \"Add Event\" and choose the type. You can hover (or long-press) on any type in the dropdown menu to see a description of what it does."
        - question: "How do I model property purchases?"
          answer:
            - "Use the \"Real Estate\" event type. As is the case with all the event types, you can enter it directly or use the Event Wizard to guide you."
            - "If you enter it directly, enter a name for the property, the price (or the down payment if using a mortgage), purchase date (which can be in the past), expected sale date (leave it blank if you won't sell it), and the expected appreciation rate."
            - "You can then create a \"Mortgage\" event for it, with the same start date, then enter the yearly mortgage repayment, end date and the interest rate."
            - "Or, if you use the Event Wizard and you choose mortgage financing, the wizard creates the linked Mortgage event for you."
            - "You can add multiple properties to your plan."
        - question: "What if I want to buy a property in cash?"
          answer:
            - "Choose cash purchase in the wizard, or enter the full purchase price in the Real Estate row and don't add a mortgage event for that property."
        - question: "Can couples use this together?"
          answer:
            - "Yes! Toggle to \"Two-Person Mode\" using the {icon:user-friends} icon. This allows separate incomes, pensions, and retirement ages."
            - "The simulator applies the active country's couple or partner tax rules while keeping each person's income, pensions, and retirement timing separate."
        - question: "What is Monte Carlo simulation?"
          answer:
            - "When in Variable Growth mode, your scenario runs thousands of times with random variations in investment returns."
            - "The simulator then counts what percentage of those runs were successful (i.e. reached your target age without running out of money)."
            - "The result shows the probability of success of your scenario and gives you an idea of the range of possible outcomes."
        - question: "How do I find the critical points in my plan?"
          answer:
            - "Use the color schemes ({icon:palette}) in the simulation data table to understand where your plan tends to fail." 
        - question: "How do relocation events work?"
          answer:
            - "A Relocation event changes your country of residence from a specific point in time, so the simulator can apply the new country's tax rules and economic conditions."
            - "After you add a relocation event, some events may be impacted and show warning badges. Use the inline suggestions to resolve the issues: split events, keep original currencies, link events to a country, or convert values."
            - "Multi-country scenarios show country flags in the input areas for country-specific inputs, and may add currency selectors for the charts and the data table."
        - question: "How does currency conversion work in charts and tables?"
          answer:
            - "In multi-currency scenarios, you can choose to have the charts and tables show local currencies or convert everything into one reporting currency."
            - “The simulator starts from exchange-rate anchors (updated monthly) and projects them into the future using relative inflation between countries.”
            - "Purchasing Power Parity (PPP) is used for suggesting equivalent values when resolving events impacted by a relocation."
        - question: "Is the free tier based on a real country?"
          answer:
            - "No. The free tier uses simple fictitious tax rules so you can learn the simulator or teach financial literacy without choosing a real country plan."
            - "Only paid tiers unlock country-specific tax rules and investment wrappers. Relocation needs at least two unlocked real countries." 
        - question: "How accurate are the projections with real country tax rules?"
          answer:
            - "Tax rules for real countries are a best effort representation of the actual tax system in each modeled country, but there will be some simplifications and approximations."
            - "The projections are estimates based on your inputs and assumptions about future economic conditions. Not a prediction of the future."
        - question: "Is my financial data secure?"
          answer:
            - "Yes, your scenarios stay on your computer or phone. They're not sent to any server or stored online."
            - "If you don't save your scenario before closing this browser tab, it will be lost."
        - question: "What do you store in your servers?"
          answer:
            - "If you only use the free tier, I only get your public IP address."
            - "If you subscribe to a paid tier, your license and the email you gave Stripe are stored in my servers. I store your email so I can identify your license and send it to you in case you need to recover it."
            - "If you send me feedback, I store that feedback in my servers. I will also store your email if you decide to share it with me so that I can respond to you."
            - "I promise I won't spam your email. I encourage you to use a disposable email address service (like 33mail.com) so you can block me if I ever break my promise."
        - question: "Why would I need to recover my license?"
          answer:
            - "You hold a copy of your license in your browser's local storage."
            - "If you clear your browser storage, you lose access to your license."
            - "Also, if you access this website from another browser or device, it won't have a copy of your license."
            - "In those cases, use the [recover license] in the (☰) menu and the system will restore it by looking up your email address in my servers." 
        - question: "Can I use my paid license on more than one device?"
          answer:
            - "Yes: use the [recover license] button in the (☰) menu, enter the email you use with Stripe, and you'll get an email with a recovery link." 
        - question: "Can I access my saved scenarios from another device?"
          answer:
            - "Yes, but you have to copy the scenario files to the other device."
            - "Your saved scenarios are only in the devices you saved them to."
        - question: "How do I plan for a couple instead of one person?"
          answer:
            - "Use the person toggle at the top of the parameters to switch between individual and two-person mode. Two-person mode adds separate ages, pension contributions, and state pension settings for the second person, while household income and expenses stay shared."
        - question: "What is the difference between fixed and variable growth?"
          answer:
            - "The growth mode toggle switches between a fixed annual growth rate and variable growth with volatility. With volatility values set, the simulator runs thousands of Monte Carlo simulations under different market conditions and reports the likelihood that your plan succeeds."
        - question: "Can I work with years instead of ages in the Events table?"
          answer:
            - "Yes. The Events table has a toggle to switch between age-based and year-based planning. There is also a cards view that presents each event as a collapsible card, which works better on smaller screens."
        - question: "What is the fastest way to get familiar with the simulator?"
          answer:
            - "Load the demo scenario from the Learn tab (or the Demo button in the header), run it, and explore the charts and data table. The tours and video tutorials in the Learn tab go deeper."
        - question: "How do I stress-test my plan?"
          answer:
            - "Try harsher economic assumptions: raise inflation, lower investment growth, or add market crash events to the timeline, and see how robust your plan is."
        - question: "How do I find the weak points in my plan?"
          answer:
            - "After a simulation run, use the color scheme dropdown in the data table to highlight critical periods. The coloring shows where cashflow gets tight or savings run low."

  - id: notes
    title: Notes
    contentType: list
    content:
      items:
        - title: "Privacy notice"
          description: "Your financial data never leaves your computer or phone. It's all processed in your browser."
        - title: "Use of AI"
          description: "This product was partially developed with AI, by a seasoned software engineer who obsesses about every little detail (me). But keep in mind that I'm not an accountant or financial advisor, nor am I able to vouch for the precision of every number used in modelling real countries. Approximations and simplifications were made, and mistakes happen. Send me feedback if you find an issue and I will do my best to correct it."
        - title: "Disclaimer"
          description: "This is not financial advice. It's a tool to help you understand how different decisions and scenarios can affect your long term financial future. Don't make serious financial decisions without talking to a financial advisor."


