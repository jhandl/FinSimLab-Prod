      side: "right"
      align: "start"

  - dynamicInvestmentField: "GlobalAssetVolatility"
    tours: [full, mini]
    card: growthRates
    popover:
      description: "<p>The expected standard deviation of the annual growth rate of <b>${investmentType.label}</b>.</p><p>This field is only used in variable rate simulation mode.</p><p>${investmentType.helpText}</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "LocalAssetGrowth"
    tours: [full, mini]
    card: growthRates
    popover:
      description: "<p>The expected average annual growth rate of <b>${investmentType.label}</b>, not adjusted for inflation.</p><p>${investmentType.helpText}</p>"
      side: "right"
      align: "start"

  - dynamicInvestmentField: "LocalAssetVolatility"
    tours: [full, mini]
    card: growthRates
    popover:
      description: "<p>The expected standard deviation of the annual growth rate of <b>${investmentType.label}</b>.</p><p>This field is only used in variable rate simulation mode.</p><p>${investmentType.helpText}</p>"
      side: "right"
      align: "start"

  - element: "#Inflation_currentCountry"
    tours: [full, mini]
    card: growthRates
    defaultTooltip: "The default inflation rate [for ${countryName}] based on 20 years of historical data and short-term forecast."
    popover:
      description: "<p>The expected average annual inflation rate.</p><p>Central banks aim for an inflation rate of 2% to 3%. However, deviations due to shocks (e.g., pandemics, wars, etc) are skewed towards higher numbers.</p><p>Tip: Enable the Present Value toggle in the (☰) menu to see all projected values adjusted back to today's currency terms, making it easier to understand real purchasing power across years.</p>"
      side: "right"
      align: "start"

  - element: ".events-section"
    tours: [quick, full, mini]
    card: events
    popover:
      description: "<p>Add, remove, and edit the events that make up your scenario.</p><ul><li>An event is anything that is time-bound and has a financial impact, such as income, expenses, or a market crash.</li><li>Select an event type and press Help or the ? key for details.</li><li>You can use the events wizard to help create events, and switch between table view or cards view.</li><li>Sort ⇅ the table by clicking a column header.</li></ul>"
      side: "top"
      align: "center"


