      description: "<p>The percentage of your portfolio that you plan to allocate to ${investmentType.label}.</p><p>${investmentType.helpText}</p><p>Any cash remaining after funding your emergency stash will be invested according to these proportions. If they add up to less than 100%, you'll be saving the remainder in cash.</p>"
