    income: {}
    pension: {}
    investment: {}
    realEstate: {}
    tax: {}
    capital: {}
    netIncome: {}
EventWizards:
  - eventType: SI
    category: income
    steps:
      - stepId: incomeType
        contentType: choice
        content:
          choices:
            - value: salary
            - value: rsu
            - value: rental
              condition: hasPropertyEvent
            - value: defined_benefit
              condition: dbiAvailable
            - value: tax_free
        showButtons:
          - back
          - next
      - stepId: person
        contentType: choice
        content:
          choices:
            - value: person1
            - value: person2
        showButtons:
          - back
          - next
        condition: incomeType === 'salary' && simulationMode === 'couple'
      - stepId: name
        contentType: input
        field: name
        labelPosition: top
        content:
          validation: required
        showButtons:
          - back
          - next
        condition: incomeType !== 'rental'
      - stepId: rental_property
        contentType: input
        field: name
        labelPosition: left
        content:
          inputType: propertyLink
          validation: required
        showButtons:
          - back
          - next
        condition: incomeType === 'rental'
      - stepId: amount
        contentType: input
        field: amount
        labelPosition: left
        content:
          inputType: currency
          validation: required|positive
        showButtons:
          - back
          - next
      - stepId: period
        contentType: period
        fields:
          - fromAge
          - toAge
        labelPosition: left
        content:
          validation: required|positive
        showButtons:
          - back
          - next
      - stepId: growth
        contentType: input
        field: rate
        labelPosition: left
        content:
          inputType: percentage
          validation: optional
          defaultValue: inflation
        showButtons:
          - back
          - next
        condition: fromAge !== toAge
      - stepId: pensionContribution
        contentType: choice
        content:
          choices:
            - value: 'yes'
            - value: 'no'
        showButtons:
          - back
          - next
        condition: incomeType === 'salary' && salaryHasPrivatePension === true
      - stepId: match
        contentType: input
        field: match
        content:
          inputType: percentage
          validation: optional
        showButtons:
          - back
          - next
        condition: incomeType === 'salary' && salaryHasPrivatePension === true && pensionContribution === 'yes'
      - stepId: summary
        contentType: summary
        content:
          templates:
            - condition: incomeType === 'salary' && pensionContribution === 'yes' && match
            - condition: incomeType === 'salary' && pensionContribution === 'yes'
            - {}
        showButtons:
          - back
          - create
  - eventType: E
    category: expense
    steps:
      - stepId: frequency
        contentType: choice
        content:
          choices:
            - value: oneoff
            - value: weekly
            - value: monthly
            - value: yearly
        showButtons:
          - back
          - next
      - stepId: name
        contentType: input
        field: name
        labelPosition: top
        content:
          validation: required
        showButtons:
          - back
          - next
      - stepId: cost
        contentType: input
        field: amount
        labelPosition: left
        content:
          inputType: currency
          validation: required|positive
        showButtons:
          - back
          - next
      - stepId: period
        contentType: period
        fields:
          - fromAge
          - toAge
        labelPosition: left
        content:
          validation: required|positive
        showButtons:
          - back
          - next
        condition: frequency !== 'oneoff'
      - stepId: timing
        contentType: input
        field: fromAge
        content:
          inputType: age
          validation: required|positive
        showButtons:
          - back
          - next
        condition: frequency === 'oneoff'
      - stepId: growth
        contentType: input
        field: rate
        content:
          inputType: percentage
          validation: optional
          defaultValue: inflation
        showButtons:
          - back
          - next
        condition: frequency !== 'oneoff' && fromAge !== toAge
      - stepId: summary
        contentType: summary
        content:
          templates:
            - condition: frequency === 'oneoff'
            - {}
        showButtons:
          - back
          - create
  - eventType: R
    category: property
    steps:
      - stepId: financing
        contentType: choice
        content:
          choices:
            - value: cash
            - value: mortgage
        showButtons:
          - back
          - next
      - stepId: name
        contentType: input
        field: name
        labelPosition: top
        content:
          validation: required
        showButtons:
          - back
          - next
      - stepId: cash_purchase_price
        contentType: input
        field: amount
        content:
          inputType: currency
          validation: required|positive
        showButtons:
          - back
          - next
        condition: financing === 'cash'
      - stepId: mortgage_property_price
        contentType: input
        field: propertyValue
        content:
          inputType: currency
          validation: required|positive
        showButtons:
          - back
          - next
        condition: financing === 'mortgage'
      - stepId: down_payment
        contentType: input
        field: amount
        content:
          inputType: currency
          validation: required|positive|lt:propertyValue
        showButtons:
          - back
          - next
        condition: financing === 'mortgage'
      - stepId: timing
        contentType: period
        fields:
          - fromAge
          - toAge
        labelPosition: left
        content:
          validation: fromAgeRequired|positive
        showButtons:
          - back
          - next
      - stepId: appreciation
        contentType: input
        field: rate
        labelPosition: left
        content:
          inputType: percentage
          validation: optional
          showRequirementNote: false
        showButtons:
          - back
          - next
        condition: fromAge !== toAge
      - stepId: mortgage_setup
        contentType: mortgage
        labelPosition: left
        content:
          text: ''
        showButtons:
          - back
          - next
        condition: financing === 'mortgage'
      - stepId: summary
        contentType: summary
        content:
          templates:
            - condition: financing === 'cash'
            - {}
        showButtons:
          - back
          - create
