  features:
    title: Key Features
    scenario:
      title: Scenario Planning
      description: Model your financial future with customisable life events and economic conditions.
    countries:
      title: Multi-Country Tax Engine
      description: Local taxes for multiple countries are modeled. See what happens when you move to another country.
    privacy:
      title: Private by Design
      description: Your scenario data stays on your device. We don't ask you to connect your bank account. We only get your email if you buy a license.
    stress:
      title: Stress Testing
      description: Test your financial plan against market crashes and adverse economic conditions.
    likelihood:
      title: Success Likelihood
      description: Understand the probability of success with volatility-based simulations.
    data:
      title: Data Deep Dive
      description: See a detailed year-by-year breakdown of the numbers. Hover to see where each number comes from.
  howItWorks:
    title: How It Works
    input:
      number: "1"
      title: Input Your Financial Data
      description: Enter your current financial situation and goals, and expected economic conditions. Get detailed help for each field. It all stays in your browser. A guided setup helps you get started.
    events:
      number: "2"
      title: Add Life Events
      description: Create events for income, expenses, and major life changes like buying a house or changing jobs. A wizard is there to help you create events.
    simulate:
      number: "3"
      title: Run Simulation
      description: See how your financial future could unfold through detailed graphs and year-by-year breakdowns. Get a high-level overview or dive into the numbers.
    compare:
      number: "4"
      title: Change one thing and compare
      description: Tweak assumptions, save versions, see where your plan is more likely to fail, learn which decisions actually move the needle.
  about:
    title: About
    developer: I'm a software developer with a passion for financial literacy and an itch I needed to scratch.
    motivation: When I started my investment journey I hired a financial advisor who gave me sound advice and a view of my financial future with nice charts and data. But the engineer in me wanted to play with the numbers and see how they impacted the outcome.
    historyBeforeLink: I first built a google sheet and
    historyLink: shared it on reddit
    historyAfterLink: ", but every time I made a change it forced users to make a new copy and re-enter their data. So I turned it into this website."
    access: I believe that everyone should have access to tools that help them improve their financial understanding for more productive conversations with professional advisors.
    hope: I hope this tool helps you as much as it helped me.
  blog:
    title: Blog
    workflow:
      label: Workflow
      title: How FinSimLab authors country tax models
      description: The source-first process behind country models, review gates, implementation checks, and documented limitations.
    planning:
      label: Planning
      title: What a personal finance simulator can answer
      description: How to use scenarios to compare choices, stress test assumptions, and keep planning decisions grounded.
    product:
      label: Product
      title: Why FinSimLab keeps your data local
      description: A look at the privacy tradeoffs behind browser-only scenario files and transparent calculations.
    countries:
      label: Country notes
      title: Country notes
      description: Short updates when a country model lands or when a tax-model approximation deserves extra explanation.
    viewAll: View all articles
  callToAction:
    title: Ready to explore your financial future?
    action: Launch Simulator
  disclaimer:
    label: "Educational Purpose Only:"
    text: This is not a budgeting tool nor financial, investment, tax, or legal advice. Don't make serious life decisions based on this. It's not a substitute for a good financial advisor.
