      description: <p>Mortgage events don't use this field.</p>
  - popover:
      description: <p>Mortgage overpay events don't use this field.</p>
  - popover:
      description: <p>Mortgage payoff events don't use this field.</p>
  - popover:
      description: <p>Reverse mortgage events don't use this field.</p>
  - popover:
      description: <p>Click the ⇅ icon to keep the table sorted by any column. Click once for ascending ▲, twice for descending ▼, and a third time to stop sorting.</p>
  - popover:
      description: <p>Toggle to see the events as a table.</p><p>This view is ideal for larger screens and when you know your way around these events. It's more like a spreadsheet, where you see all the data at a glance and can modify it directly.</p>
  - popover:
      description: <p>Toggle to see the events as expandable panels.</p><p>This view is best for smaller screens or when you're learning the ropes. When expanded, the event information is more like a form, with clear labels that make it easier to understand what they are for.</p>
  - popover:
      description: '<p>Toggle to see the start and end points of events in terms of age.</p><p>In single-person mode, all events will be relative to your age. In two-person mode, some events will refer to the other person''s age (e.g. their salary income). You can check what year that represents by switching to the Year mode, or by hovering over an age field: a tooltip will appear with the corresponding year.</p>'
  - popover:
      description: <p>Toggle to see the start and end points of events in terms of year.</p><p>In this mode, to see the age that corresponds to a given year, hover over a year field. A tooltip will appear with the corresponding age, which might be your age or the other person's age depending on the type of event and if you're in single-person or two-person mode.</p>
  - popover:
      description: '<p>Your financial projections over time.</p><ul><li><strong>Cashflow</strong>: income & expenses by category, with a line for your net cashflow and another one for your total expenses.</li><li><strong>Assets</strong>: wealth growth and distribution across different asset types.</li></ul>'
  - popover:
      description: <p><strong>Cashflow</strong> is the money moving into and out of your household each year. If more comes in than goes out, you can save or invest the difference; if less comes in, the shortfall must come from your assets.</p><p>This graph breaks down your income and compares total inflows with total outflows over time.</p><p>In multi-currency scenarios, unified display converts amounts using the simulator's FX model. Hover over data points to see the original currency values.</p>
  - popover:
      description: <p><strong>Assets</strong> are things you own that hold financial value, such as cash, investments, pensions, and property. Unlike cashflow, which measures money moving during a year, assets show what you have accumulated at each point in time.</p><p>This graph shows how the value and mix of your assets are projected to change over time.</p><p>In multi-currency scenarios, unified display converts amounts using the simulator's FX model. Hover over data points to see original currency values.</p>
  - popover:
      description: <p>The actual year-by-year numbers as they are computed by the simulator, from your current age to the final age.</p><p>On smaller screens the table is hidden but you can tap 'Show anyway' to see it.</p><p>You can hover, click or touch any cell with a small 'i' to get a tooltip with more detailed information.</p><p>In multi-currency scenarios, unified display converts amounts using the simulator's FX model.</p>
  - popover:
      description: <p>Change the color scheme used to highlight the data table rows.</p><p>Different color schemes help you visualize different aspects of your financial plan, such as cash flow patterns and potential problem areas. The colors are applied to table rows based on the financial data for that year. To get more info on each color scheme, click the icon and hover over each color scheme name.</p>
  - popover:
      description: <p>Export the simulation data table as a CSV file.</p><p>This allows you to save the detailed year-by-year financial data to analyze in spreadsheet applications like Excel or Google Sheets.</p>
  - popover:
      title: Tour Complete!
      description: |
        <p><b>Congratulations!</b> You've completed the tour of the Finance Simulation Lab.</p> <p>Remember that you can always get help if you're in doubt while filling a field by clicking Help or pressing the ? key.</p> <p><b>Happy planning!</b> 🎯</p>
      demoEpilogue: |
        <p>You've been exploring a sample plan. Use New when you're ready to start your own.</p>
      prevBtnText: Back
      nextBtnText: Done
