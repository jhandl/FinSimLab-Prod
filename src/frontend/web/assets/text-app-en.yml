  drawdownPriorities:
    title: Drawdown Priorities
    body:
      - When your income doesn't cover your spending, we need to know in which order to withdraw from your savings and investments.
      - This order tells the simulator where to take money from when there is a shortfall. The top one is used first.
    animationCaption: You can rearrange the list on the next panel.
    button: Review order
  economy:
    title: Economy
    body:
      - We're now going to assume neutral economy conditions (returns and volatility).
      - These are default assumptions, not forecasts or recommendations. Edit them whenever you like.
    button: Review assumptions
    questions:
      inflation: What inflation rate should this plan use?
      growthAssumptions: Confirm or edit the starter equity growth and bond yield.
    why:
      inflation: Inflation affects what future money is worth in today's terms.
      growthAssumptions: Growth assumptions drive long-term investment projections, but they are not recommendations.
