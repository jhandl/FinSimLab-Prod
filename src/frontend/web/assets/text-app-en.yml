        tooltip: Restores the base mortgage timing and removes relocation-linked payoff rows when possible.
      joinHalves:
        label: Join halves
        tooltip: Restores a single event from age {fromAge} to {toAge} using {amount}.
WelcomeTabs:
  - id: start
    title: Start here
    content:
      intro: See how your money could play out over a lifetime.
      contextPrefix: ', using '
      contextSuffix: .
      quick:
        title: Quick setup
        subtitle: Create a rough sketch of a plan to get a feel for how it all works.
        badge: about 5 min
      full:
        title: Full setup
        subtitle: Create a detailed plan with guidance every step of the way.
        badge: about 15 min
      tours:
        label: Look around first.
        items:
          - id: quick-tour
            title: Quick tour
            subtitle: the main areas · 2 min
          - id: full-tour
            title: Full tour
            subtitle: every field · your pace
      chipFree: sample tax rules
      chipSingle: '{CountryName} tax model'
      chipMulti: your unlocked countries' model
  - id: tutorials
    title: Tutorials
    content:
      progressActionLabel: Change tutorial progress
      fullscreenPlayLabel: Play fullscreen
      fullscreenCloseLabel: Close video
      fullscreenDialogLabel: Tutorial video
      progressLabels:
        notStarted: Not started
        inProgress: In progress
        completed: Completed
      items:
        - id: tour
          title: Tour of the Simulator
          duration: 4 min
          videoTitle: Tour of the Simulator
          description: |
            - What each main screen area is for
            - How scenarios move from inputs to results
        - id: starting-position
          title: Entering Your Starting Position
          duration: 5 min
          videoTitle: Entering Your Starting Position
          description: |
            - Which fields describe your current financial position
            - How ages, assets, pensions, and targets shape every run
        - id: adding-events
          title: Adding Events
          duration: 6 min
          videoTitle: Adding Events
          description: |
            - When to use the Events table
            - How salaries, expenses, windfalls, and shocks affect the timeline
        - id: property-mortgages
          title: Buying Property and Mortgages
          duration: 7 min
          videoTitle: Buying Property and Mortgages
          description: |
            - How purchase and mortgage events connect
            - How property sales and mortgage payoffs appear in results
        - id: investments-pensions
          title: Investments, Pensions, and Allocations
          duration: 6 min
          videoTitle: Investments, Pensions, and Allocations
          description: |
            - How surplus cash is allocated
