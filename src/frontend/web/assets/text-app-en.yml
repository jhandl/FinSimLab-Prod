      description: <p>Selects which global instrument your partner's private pension contributions are invested in.</p><p>Use <b>Mix...</b> to split between two instruments over time (fixed mix or glidepath).</p>
  - popover:
      description: '<p>The annual fee that your pension provider charges to hold your pension. Default: ${investmentType.defaultFeeText}.</p>'
  - popover:
      description: '<p>The annual fee that your partner''s pension provider charges to hold their pension. Default: ${investmentType.defaultFeeText}.</p>'
  - popover:
      description: ${investmentType.contributionDescriptionP1}
  - popover:
      description: ${investmentType.contributionDescriptionP2}
  - popover:
      description: '<p>Limit on your pension contribution. Tax relief applies only up to the annual cap defined in the current tax model.<ul><li><b>Yes</b>: stop at the ${taxRules.pensionRules.contributionLimits.annualCap,currency} cap (inflation-adjusted).</li><li><b>No</b>: pay tax on amounts above the ${taxRules.pensionRules.contributionLimits.annualCap,currency} cap.</li><li><b>Match</b>: contribute only what your employer matches (e.g. 4% you + 4% employer).</li></ul></p>'
  - popover:
      description: <p>Set the withdrawal order of your assets:</p><ul><li>Drag items to reorder; top = used first.</li><li>Priorities matter when covering expenses when income is insufficient (e.g., retirement withdrawals).</li></ul>
  - popover:
      description: <p>Here is where you speculate how the economy will do on average in the future.</p><p>Use the toggle in the top right to switch between fixed and variable growth modes.</p><p>You may want to enter conservative growth numbers to stress test your scenario.</p>
  - popover:
      description: <p>Fixed growth mode.</p><p>In this mode, the simulation uses fixed growth rates without volatility. This provides a single, predictable outcome based on your specified growth rates. Volatility fields are hidden in this mode.</p>
  - popover:
      description: <p>Variable growth mode.</p><p>In this mode, the simulator runs hundreds of times with varying growth rates according to the volatility you specify. This provides a probability of success rather than a single outcome, accounting for market uncertainty and fluctuations. At least one of the volatility rates must be greater than 0%.</p>
  - popover:
      description: <p>The expected average annual growth rate of <b>${investmentType.label}</b>, independent of inflation.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>The expected standard deviation of the annual growth rate of <b>${investmentType.label}</b>.</p><p>This field is only used in variable rate simulation mode.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>The expected average annual growth rate of <b>${investmentType.label}</b>, independent of inflation.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>The expected standard deviation of the annual growth rate of <b>${investmentType.label}</b>.</p><p>This field is only used in variable rate simulation mode.</p><p>${investmentType.helpText}</p>
  - defaultTooltip: The default inflation rate [for ${countryName}] based on 20 years of historical data and short-term forecast.
    popover:
      description: '<p>The expected average annual inflation rate.</p><p>Central banks in stable economies aim for an annual inflation rate of 2% to 3%. However, deviations due to shocks (e.g., pandemics, wars, etc) are skewed towards higher numbers.</p><p>Tip: Enable the Present Value toggle in the (☰) menu to see all projected values adjusted back to today''s currency terms, making it easier to understand real purchasing power across years.</p>'
  - popover:
      description: <p>Add, remove, and edit the events that make up your scenario.</p><ul><li>An event is anything that is time-bound and has a financial impact, such as income, expenses, or a market crash.</li><li>Select an event type and press Help or the ? key for details.</li><li>You can use the events wizard to help create events, and switch between table view or cards view.</li><li>Sort ⇅ the table by clicking a column header.</li></ul>
  - popover:
      description: <p>Click this button to launch the Event Wizard to help you fill out an empty event.</p>
  - popover:
      description: '<p>Choose what kind of event this row represents: income, expense, property, market crash, etc. The other fields will automatically adapt to your selection.</p>'
  - popover:
      description: <p>The 'No Operation' is a way to mute an event without deleting it.</p><p>If you select it, the event will not be used by the simulation.</p>
  - popover:
      description: <p>Your gross salary income.</p><p>This income can contribute to your private pension based on your pension contribution percentage.</p>
  - popover:
      description: <p>A gross salary income that does not contribute to your pension.</p><p>This is useful for modeling salary income that doesn't qualify for pension contributions, or in countries where there's no private pension system.</p>
  - popover:
      description: <p>A gross salary income for your partner.</p><p>This income can contribute to your partner's private pension based on their pension contribution percentage.</p>
  - popover:
      description: <p>A gross salary income for your partner that does not contribute to their pension.</p><p>This is useful for modeling salary income that doesn't qualify for pension contributions, or in countries where there's no private pension system.</p>
  - popover:
      description: <p>The gross yearly value of Restricted Stock Units as they vest, provided by some employers as part of the compensation package.</p>
  - popover:
      description: <p>The gross rental income from a linked property.</p>
  - popover:
      description: <p>An occupational pension scheme that provides a fixed income in retirement.</p>
  - popover:
      description: <p>This event lets you add a net income from things like a gift or inheritance.</p><p>It assumes any tax has already been paid, so this is kind of a wildcard event that lets you inject cash into your income stream.</p>
  - popover:
      description: <p>An expense item. You can add an expense event for your total yearly cost of living, and other ones for transient or one-off expenses like college tuition, a car, etc.</p>
  - popover:
      description: <p>A stock market crash or bubble. Using this event you can stress test your plan.</p>
  - popover:
      description: <p>The ownership of a real estate property.</p><p>If the purchase is financed, also add a Mortgage event and link it using the selector in the name column of mortgage-related rows. Or use the Event Wizard, which creates both events together.</p>
  - popover:
      description: <p>A mortgage on a real estate property.</p><p>Use the name-column selector to choose which property this mortgage belongs to. Or use the Event Wizard, which creates both the property purchase and the mortgage events together. </p>
  - popover:
      description: <p>An extra principal payment on top of the regular mortgage repayments.</p>
  - popover:
      description: <p>A one-off mortgage payoff event. It settles the remaining mortgage balance.</p>
  - popover:
      description: <p>A reverse mortgage that pays out cash while accruing a debt against the property value.</p>
  - popover:
      description: <p>A relocation event. It changes your country of residence at a specific age and checks affected events for currency, country-link, and split-range issues.</p>
  - popover:
      description: <p>The name of the event.</p><p>For regular text fields, you can enter any label you want for your own reference.</p>
  - popover:
      description: <p>No Operation events ignore all fields.</p>
  - popover:
      description: <p>The name of the rental income.</p><p>You can enter any name you want. It's just for your reference.</p>
  - popover:
      description: <p>The name of your salary income.</p><p>You can enter any name you want. It's just for your reference.</p>
  - popover:
