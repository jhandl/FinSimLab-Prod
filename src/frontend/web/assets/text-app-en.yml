  - popover:
      description: <p>This cell is a destination-country selector.</p><p>Choose the country you are moving to. The simulator will apply that country's tax and economic model starting at the relocation age.</p>
  - popover:
      description: <p>This cell is a destination-country selector.</p><p>Choose the country you are moving to. The simulator will apply that country's tax and economic rules starting at the relocation age.</p>
  - popover:
      description: '<p>The yearly amount for the event, expressed in present value.</p><p>For Real Estate, enter the cash paid at purchase: the full price for a cash purchase, or the down payment if financed. For Mortgage, enter the amount you will repay each year.</p>'
  - popover:
