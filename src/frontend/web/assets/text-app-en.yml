        - **Red**: Assets need to be sold to cover expenses.
        - **Color intensity**: The size of the surplus / deficit.
    failure:
      name: Failure
      description: |
        ### Failure Rate

        Shows where your plan is most likely to fail.

        - **Green**: You're likely not running out of money this year.
        - **Red**: You're more likely to run out of money this year.
    survival:
      name: Survival
      description: |
        ### Survival Rate

