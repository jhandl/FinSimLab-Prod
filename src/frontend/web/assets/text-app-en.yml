  - popover:
      description: <p>The present value of the yearly amount you will repay on the mortgage.</p><p>You can get this number from an online mortgage calculator, and multiplying the monthly repayment by 12. Or you can use the events wizard, and it will calculate this value for you.</p>
  - popover:
      description: <p>The extra yearly amount paid on top of the mortgage.</p>
  - popover:
