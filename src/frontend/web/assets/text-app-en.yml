    exitConfirmTitle: Exit Guided Setup
  fieldNotes:
    required: This one is needed to build the plan.
    optionalZero: Optional. You can fill it in on the panel later.
    reassurance: A rough estimate is fine. You can refine this later.
  interviewOpeners:
    free: Rough or even made-up numbers work fine. This sandbox uses fictional tax rules.
    entitled: Ballpark figures are fine. You can refine everything later.
  events:
    singleSalaryName: Salary
    salaryName: Your salary
    partnerSalaryName: Partner's salary
    expensesName: Living expenses
    rentName: Rent
    homeName: Home
GuidedSections:
  startingPosition:
    title: Starting Position
    questions:
      planFor: Who is this plan for?
      country: Which country do you live in?
      ages: How old are you both?
      startingAge: How old are you?
      p2StartingAge: How old is your partner?
      initialSavings: Roughly how much do you have in savings right now? A ballpark is fine.
      pensionPots: What is already in your pension pots?
      initialPension: Do you have a pension pot already? Roughly how much is in it? Leave blank if you're not sure.
      initialPensionP2: Does your partner have a pension pot already? Roughly how much is in it? Leave blank if you're not sure.
      currentBalances: What is already invested outside pensions?
    why:
      planFor: Couples are taxed differently in many countries.
      country: Each country has its own tax rules and we model them to make projections.
      ages: Ages anchor the timeline and drive every event, tax band, and pension rule.
      initialSavings: Your starting cash is the simulation's opening balance.
      pensionPots: Pension pots grow tax-free and unlock at retirement. If you already have a pot, that adds up.
      currentBalances: Starting investment balances let the first projection begin from your real portfolio.
    choices:
      justMe: Just me
      couple: Me and my partner
  personalCircumstances:
    title: Personal Circumstances
    questions:
      marriageYear: In what year did you or do you expect to get married? Leave blank if not.
      hasChildren: Do you have children or plan to have them?
      childrenBirthYears: When were or will your children be born?
      oldestChildBorn: What year was or would your oldest child be born?
      youngestChildBorn: And your youngest? Skip if you have only one child.
    why:
      marriageYear: Marriage can change tax credits and bands from that year on.
      hasChildren: Children can affect tax credits and, in some countries, benefits.
      childrenBirthYears: Tax credits and benefits for having children only last while they are still children.
    choices:
      'true': 'Yes'
      'false': 'No'
  targets:
    title: Targets
    questions:
      retirementAges: 'Let''s talk about when you''d like to retire:'
      retirementAge: At what age would you like to stop working?
      p2RetirementAge: And your partner?
      targetAge: How long should the plan run? We'll simulate up to this age.
      emergencyStash: How much would you like to keep set aside for emergencies? Skip if unsure.
    why:
      retirementAges: When salaries stop and pension drawdown can begin. Earlier means fewer earning years and a longer drawdown.
      targetAge: You want to assume longevity to see whether you reach old age without running out of money.
      emergencyStash: The simulator keeps this much in cash before investing surpluses.
  moneyHabits:
    title: Money Habits
    questions:
      pensionContribution: Does money go into a pension from your pay? Enter a percentage of salary, or choose Max for the tax-relieved maximum. Leave blank if unsure.
      pensionContributionP2: Does money go into your partner's pension from their pay? Enter a percentage of salary, or choose Max.
      pensionContributionLabel: Your %
      pensionContributionP2Label: Your partner's %
      pensionContributionMaxNote: 'Tip: the Max button contributes the most your country allows tax-free.'
      surplusDestination: When there's money left over after spending, what usually happens to it?
      investedShare: Roughly what share of your spare money gets invested? A guess is fine.
      allocationSplit: How is spare money split across investment types?
    why:
      pensionContribution: This affects taxes now and pension balances later.
      surplusDestination: This decides whether spare cash stays liquid or gets a chance to grow.
      investedShare: We'll split this between all types of investment (a simplification to keep things moving, not a recommendation). You can make adjustments on the panel.
      allocationSplit: The split matters because each investment type can have different growth and tax treatment.
    allocationStatus:
      cashSurplus: '{value}% stays in cash'
      exceeded: Reduce allocations by {value}% to stay within 100%
    choices:
      bank: It stays in my bank account
      invested: Some of it gets invested
  events:
    title: Your Events
    intro: Events are the story of your financial life — income, spending, home. Let's add the basics.
    questions:
      salary: Do you earn a salary?
      salaryDetails: How much do you earn, and until when?
      salaryAmount: Roughly how much per year, before tax?
      salaryUntilAge: Until what age?
      salaryMatch: Does your employer pay into your pension too? What percentage of salary do they match? Skip if none or unsure.
      partnerSalary: Does your partner earn a salary?
      partnerSalaryDetails: How much does your partner earn, and until when?
      partnerSalaryAmount: Roughly how much does your partner earn per year, before tax?
      partnerSalaryUntilAge: Until what age will your partner earn a salary?
      partnerSalaryMatch: Does your partner's employer pay into their pension too? What percentage of salary do they match? Skip if none or unsure.
      expensesRent: Roughly how much does your household spend per year, not counting rent? A ballpark is fine.
      expensesMortgage: Roughly how much does your household spend per year, not counting mortgage payments? A ballpark is fine.
      expensesOwn: Roughly how much does your household spend per year? A ballpark is fine.
