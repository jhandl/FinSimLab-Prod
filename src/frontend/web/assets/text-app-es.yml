EventWizards:
  - eventType: SI
    name: Ingresos
    steps:
      - stepId: incomeType
        title: Tipo de ingresos
        content:
          text: ¿Qué tipo de ingresos son?
          choices:
            - value: salary
              title: Salario
              description: Ingresos laborales regulares
            - value: rsu
              title: RSU
              description: Unidades de acciones restringidas
            - value: rental
              title: Alquiler
              description: Ingresos por alquiler de una propiedad
            - value: defined_benefit
              title: Prestación definida
              description: Pensión o plan de prestación definida
            - value: tax_free
              title: Ingresos libres de impuestos
              description: Ingresos no sujetos a impuestos
      - stepId: person
        title: ¿Para quién?
        content:
          text: ¿Quién recibirá estos ingresos salariales?
          choices:
            - value: person1
              title: Tú
              description: Tus ingresos salariales
            - value: person2
              title: Tu pareja
              description: Los ingresos salariales de tu pareja
      - stepId: name
        title: Nombra tus ingresos
        content:
          text: 'Da a estos ingresos un nombre descriptivo:'
      - stepId: rental_property
        title: Propiedad vinculada
        content:
          text: 'Selecciona la propiedad para estos ingresos por alquiler:'
      - stepId: amount
        title: Importe anual
        content:
          text: 'Introduce el importe anual de estos ingresos:'
          help: Introduce el importe bruto anual antes de impuestos y deducciones.
      - stepId: period
        title: Periodo de ingresos
        content:
          text: ¿Cuándo recibirás estos ingresos?
          help: Introduce el rango de edad durante el que recibirás estos ingresos.
      - stepId: growth
        title: Tasa de crecimiento
        content:
          text: ¿Qué tasa de crecimiento anual esperas?
          help: Déjalo en blanco para usar la tasa de inflación.
      - stepId: pensionContribution
        title: Aporte a la pensión
        content:
          text: ¿Este salario incluye aportes a una pensión?
          choices:
            - value: 'yes'
              title: Sí
              description: Este salario incluye aportes a la pensión
            - value: 'no'
              title: 'No'
              description: Este salario no incluye aportes a la pensión
      - stepId: match
        title: Aporte equivalente del empleador a la pensión
        content:
          text: ¿Tu empleador iguala las aportes a la pensión? Si es así, ¿hasta qué porcentaje?
          help: Déjalo en blanco si tu empleador no iguala las aportes a la pensión.
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: salario bruto de {amount} al año {periodPhrase}{growthPart}{matchPart}.'
            - template: '{name}: salario bruto de {amount} al año {periodPhrase}{growthPart}.'
            - template: '{name}: ingresos de tipo {incomeType} de {amount} al año {periodPhrase}{growthPart}.'
  - eventType: E
    name: Gasto
    description: Añade un gasto regular o puntual
    difficulty: sencillo
    steps:
      - stepId: frequency
        title: Frecuencia del gasto
        content:
          text: ¿Con qué frecuencia se produce este gasto?
          choices:
            - value: oneoff
              title: Puntual
              description: Un gasto único que se produce una vez
            - value: weekly
              title: Semanal
              description: Se produce cada semana
            - value: monthly
              title: Mensual
              description: Se produce cada mes
            - value: yearly
              title: Anual
              description: Se produce una vez al año
      - stepId: name
        title: Nombra tu gasto
        content:
          text: 'Da a este gasto un nombre descriptivo:'
      - stepId: cost
        title: Coste
        content:
          text: ¿Cuál es el coste {frequency} de este gasto?
      - stepId: period
        title: Periodo del gasto
        content:
          text: ¿Durante qué periodo tendrás este gasto?
      - stepId: timing
        title: ¿Cuándo se producirá este gasto?
        content:
          text: ¿A qué edad tendrás este gasto único?
      - stepId: growth
        title: Crecimiento del coste
        content:
          text: ¿Cuánto esperas que crezca este gasto anualmente?
          help: Déjalo en blanco para usar la tasa de inflación.
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: gasto puntual de {amount} a los {fromAge} años{growthPart}.'
            - template: '{name}: gasto de {amount} {frequencyText} (≈ {annualAmount} al año) {periodPhrase}{growthPart}.'
  - eventType: R
    name: Compra de una propiedad
    steps:
      - stepId: financing
        title: ¿Cómo financiarás esta propiedad?
        content:
          text: 'Elige tu método de financiación:'
          choices:
            - value: cash
              title: Compra al contado
              description: Compra la propiedad al contado sin una hipoteca
            - value: mortgage
              title: Con hipoteca
              description: Compra con un pago inicial y financiación hipotecaria
      - stepId: name
        title: Nombre de la propiedad
        content:
          text: 'Dale un nombre a esta propiedad:'
          why: Este nombre vincula la propiedad, la hipoteca, el alquiler y los detalles de venta en la simulación.
      - stepId: cash_purchase_price
        title: Precio de compra de la propiedad
        content:
          text: ¿Cuál es el precio total de compra de la propiedad?
          why: Esto se convierte en el valor de la propiedad y el coste de compra en tu plan.
      - stepId: mortgage_property_price
        title: Valor de la propiedad
        content:
          text: ¿Cuál es el precio total de compra de la propiedad?
          why: Esto establece el valor de la propiedad usado para calcular el importe de la hipoteca.
      - stepId: down_payment
        title: Pago inicial
        content:
          text: ¿Cuánto pagarás como pago inicial?
          why: El precio de compra restante se convierte en el capital de la hipoteca.
      - stepId: timing
        title: Momento de compra y venta
        content:
          text: ¿Cuándo comprarás y venderás esta propiedad?
          help: Si no planeas venderla, deja el segundo campo en blanco.
          why: La edad inicial ubica la compra en la simulación; la edad final controla una venta posterior.
      - stepId: appreciation
        title: Revalorización de la propiedad
        content:
          text: ¿Qué tasa anual de revalorización esperas?
          why: Déjalo en blanco para que el valor de la propiedad crezca con la inflación.
      - stepId: mortgage_setup
        title: Detalles de la hipoteca
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: Compra de una propiedad al contado por {amount} {periodPhrase}{growthPart}.'
            - template: '{name}: Compra por {propertyValue} con un pago inicial de {amount} ({downPaymentPct}) {periodPhrase}{growthPart}. Plazo del préstamo de {mortgageTerm} años a {mortgageRate} (≈ {mortgageMonthlyPayment} al mes, {mortgageAnnualPayment} al año).'
  - eventType: M
    name: Hipoteca
    steps:
      - stepId: name
        title: Propiedad vinculada
        content:
          text: 'Selecciona la propiedad para esta hipoteca:'
      - stepId: property_value
        title: Valor de la propiedad
        content:
          text: ¿Cuál es el valor total de la propiedad?
      - stepId: down_payment
        title: Pago inicial
        content:
          text: ¿Cuánto pagarás como pago inicial?
      - stepId: start_age
        title: Momento de inicio de la hipoteca
        content:
          text: ¿A qué edad/año empieza esta hipoteca?
      - stepId: mortgage_setup
        title: Detalles de la hipoteca
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: Hipoteca sobre una propiedad valorada en {propertyValue} con un pago inicial de {amount} ({downPaymentPct}), que comienza a la edad/año {fromAge}. Plazo del préstamo de {mortgageTerm} años a {mortgageRate} (≈ {mortgageMonthlyPayment} al mes, {mortgageAnnualPayment} al año).'
  - eventType: MO
    name: Pago anticipado de hipoteca
    steps:
      - stepId: name
        title: Hipoteca vinculada
        content:
          text: 'Selecciona la hipoteca a la que se aplica:'
      - stepId: amount
        title: Importe anual de pago anticipado
        content:
          text: ¿Cuánto pagarás de más cada año?
      - stepId: period
        title: Periodo de pago anticipado
        content:
          text: ¿Cuándo empieza y termina este pago anticipado?
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: pago anticipado de {amount} al año {periodPhrase}.'
  - eventType: MP
    name: Liquidación de hipoteca
    steps:
      - stepId: name
        title: Hipoteca vinculada
        content:
          text: 'Selecciona la hipoteca que quieres liquidar:'
      - stepId: timing
        title: Momento de liquidación
        content:
          text: ¿A qué edad/año liquidarás la hipoteca?
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: liquidación puntual de la hipoteca a la edad/año {fromAge}.'
  - eventType: MR
    name: Hipoteca inversa
    steps:
      - stepId: name
        title: Propiedad vinculada
        content:
          text: 'Selecciona la propiedad para esta hipoteca inversa:'
      - stepId: amount
        title: Desembolso anual
        content:
          text: ¿Cuánto efectivo recibirás de esta hipoteca inversa cada año?
      - stepId: period
        title: Periodo de hipoteca inversa
        content:
          text: ¿Cuándo está vigente esta hipoteca inversa?
      - stepId: rate
        title: Tasa de interés
        content:
          text: ¿Qué tasa de interés se aplica al saldo de la hipoteca inversa?
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: desembolso de hipoteca inversa de {amount} al año {periodPhrase} con interés del {rate}.'
  - eventType: SM
    name: Mercado
    steps:
      - stepId: name
        title: Pon nombre a este evento
        content:
          text: 'Da a este escenario de mercado un nombre descriptivo:'
      - stepId: period
        title: Periodo del escenario
        content:
          text: ¿Durante qué edades/años se aplica este escenario de mercado?
      - stepId: growth
        title: Crecimiento total del mercado
        content:
          text: ¿Cuál es la ganancia o pérdida del mercado durante ese periodo?
          help: Usa porcentajes negativos para las caídas.
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: '{name}: Un cambio de mercado {direction} de {rate} {periodPhrase}.'
  - eventType: MV
    name: Traslado
    steps:
      - stepId: destination
        title: País de destino
        content:
          text: ¿A qué país te trasladas?
          placeholder: Selecciona país
      - stepId: cost
        title: Coste del traslado
        content:
          text: ¿Cuál es el coste único del traslado en {relocationCostCurrencyLabel}?
          help: Incluye gastos de mudanza, tasas de visa, costes de viaje, etc. Escribe 0 si no hay coste de traslado.
      - stepId: timing
        title: Momento del traslado
        content:
          text: ¿A qué edad te trasladarás?
          help: Esta es la edad a la que planeas trasladarte al nuevo país.
      - stepId: summary
        title: Revisar y crear
        content:
          templates:
            - template: Traslado a {destCountryName} a los {fromAge} años sin coste de traslado.
            - template: Traslado a {destCountryName} a los {fromAge} años con un coste único de traslado de {amount}.
