      description: <p>La tasa media anual de crecimiento esperada del evento.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p><p>Para los eventos de bolsa, introduce la tasa de variación de la bolsa durante todo el periodo que especificaste. Esto sustituirá todas las tasas de crecimiento que introdujiste en el panel de Economía para ese periodo.</p>
