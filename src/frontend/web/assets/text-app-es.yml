  - id: faq
    title: F.A.Q.
    content:
      items:
        - question: ¿Cuál es la forma más rápida de familiarizarme con el simulador?
          answer:
            - Haz primero el <a href="#quick-tour" data-orientation-action="quick-tour">recorrido rápido</a>. Cargará un escenario de demostración y lo ejecutará (si no hay ya un escenario introducido), y explicará las áreas principales de la interfaz de usuario.
            - Puedes explorar el escenario de demostración, hacer cambios en los datos y ejecutarlo para ver qué ocurre. Revisa también los tutoriales.
            - Después recomiendo usar la <a href="#quick-setup" data-tier="quick">configuración rápida</a> para una introducción guiada a la creación de un escenario muy sencillo.
            - Cuando estés listo, puedes usar la <a href="#full-setup" data-tier="full">configuración completa</a> para una creación guiada paso a paso de un escenario completo. O usa directamente la interfaz para introducir todos tus números.
        - question: ¿Esto es asesoramiento financiero, de inversión, fiscal o legal?
          answer:
            - No. FinSim es un entorno de pruebas educativo para explorar escenarios y entender cómo distintas suposiciones pueden afectar a un plan a largo plazo.
            - No tomes decisiones financieras, de inversión, fiscales o legales importantes basándote solo en una simulación. Consulta las decisiones importantes con un profesional debidamente cualificado.
        - question: ¿Mis datos financieros están seguros?
          answer:
            - Sí, tus escenarios permanecen en tu dispositivo. No se envían a ningún servidor ni se almacenan en línea.
            - Puedes cerrar esta pestaña del navegador; tus datos seguirán apareciendo cuando la abras de nuevo, salvo que borres el almacenamiento del navegador.
            - Para mayor seguridad, lo mejor es guardar tu escenario en un archivo en disco. Usa el botón [Guardar] para hacerlo.
        - question: ¿Qué almacenas en tus servidores?
          answer:
            - Si solo usas el plan gratuito, solo recibo tu dirección IP pública.
            - Si compras un plan, tu licencia y el correo electrónico que diste a Stripe se almacenan en mis servidores. Almaceno tu correo electrónico para poder identificar tu licencia y enviártela si necesitas recuperarla.
            - Si me envías comentarios, almaceno esos comentarios en mis servidores. También almacenaré tu correo electrónico si decides compartirlo conmigo para que pueda responderte.
            - Prometo que no enviaré spam a tu correo electrónico. Te recomiendo usar un servicio gratuito de direcciones de correo electrónico desechables (como 33mail.com) para que puedas bloquearme si alguna vez incumplo mi promesa.
        - question: ¿El plan gratuito se basa en un país real?
          answer:
            - No. El plan gratuito usa reglas fiscales ficticias sencillas para que puedas aprender a usar el simulador o enseñar educación financiera sin comprar un plan.
            - Solo los planes pagos desbloquean un modelo de reglas fiscales y vehículos de inversión específicos de cada país. El traslado necesita al menos dos países reales desbloqueados.
        - question: ¿Cuánto dura un plan pago y qué ocurre cuando vence?
          answer:
            - Un plan pago proporciona un año de acceso y no se renueva automáticamente. Puedes renovarlo con descuento (consulta <a href="#country-plans" data-country-plans-action>Planes</a> para ver los detalles); renovar mientras el acceso está activo lo extiende desde la fecha de vencimiento actual.
            - Cuando el acceso vence, aún puedes usar el entorno de pruebas gratuito. No podrás cargar escenarios que requieran modelos bloqueados de países reales hasta que renueves el acceso necesario.
        - question: ¿Puedo cambiar países, mejorar mi plan u obtener un reembolso?
          answer:
            - Durante el periodo de gracia de tu plan, puedes cambiar los países seleccionados o cancelar la compra y solicitar un reembolso desde <a href="#country-plans" data-country-plans-action>Planes</a>. Después de ese periodo, los países de un plan de país de residencia o de traslado permanecen fijos hasta que termine el periodo de acceso.
            - Puedes mejorar un plan activo en cualquier momento; el precio de la mejora se prorratea por el periodo de acceso restante. Los planes activos no se pueden cambiar a un plan inferior a mitad de periodo, pero puedes elegir un plan diferente cuando venza el acceso actual.
            - El plan mundial desbloquea todos los países admitidos, así que su selección de países solo controla qué países aparecen en el simulador y se puede cambiar en cualquier momento.
        - question: ¿Qué precisión tienen las proyecciones con modelos fiscales de países reales?
          answer:
            - Los modelos fiscales de países reales son una representación lo más cuidadosa posible del sistema fiscal real de cada país modelado, pero habrá algunas simplificaciones y aproximaciones.
            - Las proyecciones son estimaciones basadas en tus datos y en tus suposiciones sobre las condiciones económicas futuras. No son una predicción del futuro.
        - question: ¿Cómo uso la tabla de eventos?
          answer:
            - Las cosas que tienen una fecha inicial y una fecha final, como tus ingresos, tus gastos o una hipoteca, van en la tabla de eventos.
            - Usa el asistente de eventos haciendo clic en [🌟 Añadir evento 🌟]. Te guiará paso a paso. O, si ya conoces los eventos, puedes desactivar el asistente en el menú ☰.
            - Puedes ordenar los eventos haciendo clic en el título de una columna. Puedes ver los eventos como una tabla ({icon:table}) o como tarjetas plegables ({icon:rectangle-list}), y puedes ver la cronología en términos de edades o años.
        - question: ¿Cómo planifico para una pareja en lugar de una sola persona?
          answer:
            - Usa el selector de persona en la parte superior del panel de posición inicial para cambiar entre los modos individual ({icon:user}) y de dos personas ({icon:user-friends}). El modo de dos personas añade edades, aportes a pensiones y ajustes de pensión estatal separados para la segunda persona, mientras que los ingresos y gastos del hogar permanecen compartidos.
        - question: ¿Puedo trabajar con años en lugar de edades en la tabla de eventos?
          answer:
            - Sí. La tabla de eventos tiene un selector para cambiar entre planificación basada en edades y planificación basada en años.
            - Ten en cuenta que, en el modo de dos personas, las edades se refieren a cada persona por separado, así que la misma edad puede referirse a años diferentes según de quién sea el evento. Cambia entre los modos de edad y año para aclararlo.
        - question: ¿Cómo modelo compras de propiedades?
          answer:
            - Usa el tipo de evento "Bienes inmuebles". Puedes introducirlo directamente o usar el asistente de eventos para guiarte.
            - Si lo introduces directamente, ingresa un nombre para la propiedad, el precio (o el pago inicial si usas una hipoteca), la fecha de compra (que puede estar en el pasado), la fecha de venta prevista (déjala en blanco si no la vas a vender) y la tasa de apreciación esperada. Después puedes crear un evento "Hipoteca" para ella, con la misma fecha inicial, y luego introducir el pago anual de la hipoteca, la fecha final y la tasa de interés.
            - Puedes añadir varias propiedades a tu plan.
        - question: ¿Por qué los números son mucho más grandes de lo que esperaba?
          answer:
            - Salvo que especifiques una inflación de 0, los números crecerán año tras año a la tasa de inflación.
            - Pero los valores que ingresas en los distintos campos tienen que estar en términos de valor actual. Por ejemplo, si esperas comprar una propiedad dentro de 10 años, debes introducir el valor actual de la propiedad, no el valor que esperas que tenga dentro de 10 años.
            - Si prefieres ver todos los valores en términos actuales sin el crecimiento por inflación (manteniendo aun así una inflación realista), activa el selector de valor actual en el menú (☰). Esto ajustará automáticamente todos los importes mostrados por inflación, para que sean más fáciles de entender y comparar.
        - question: ¿Qué es la visualización de valor actual y cómo la uso?
          answer:
            - La visualización de valor actual muestra todos los importes proyectados (ingresos, gastos, inversiones, impuestos, etc.) en términos actuales.
            - En lugar de ver importes nominales inflados (por ejemplo, un salario de 500.000 € dentro de 30 años), ves cuánto vale ese importe en términos actuales. Esto te ayuda a comparar valores entre distintos años y a entender el impacto real de tus decisiones financieras.
            - Puedes activar la visualización de valor actual usando el selector del menú ☰. Cuando está activada, todos los valores de la tabla de datos y los gráficos se deflactan automáticamente para mostrar sus equivalentes en valor actual. Desactívala para ver los valores nominales originales (inflados).
            - 'Ten en cuenta que los cálculos de la simulación siguen siendo los mismos: solo cambia la visualización. La exportación CSV de la tabla de datos contendrá los valores mostrados en ese momento.'
        - question: ¿Por qué los créditos fiscales y los límites también se ajustan por inflación?
          answer:
            - Aunque algunos de los números fiscales no cambian todos los años, muchos sí suelen hacerlo, aunque eso cambia de un país a otro.
            - Tengo que asumir algún ajuste periódico, y la inflación es el mejor indicador aproximado que se me ocurre. Estoy abierto a sugerencias sobre cómo hacerlo mejor.
        - question: ¿Por qué veo este número inesperado en la tabla de datos de la simulación?
          answer:
            - Muchas celdas de la tabla tienen una pequeña "i" en la esquina inferior derecha. Eso significa que la celda tiene una descripción emergente asociada.
            - Puedes pasar el cursor, hacer clic o mantener pulsada la celda para ver de dónde viene el número.
        - question: ¿Las tasas de crecimiento de las inversiones son antes o después de la inflación y las comisiones?
          answer:
            - Las tasas de crecimiento de las inversiones en el panel de economía son nominales (antes de la inflación) y antes de comisiones.
            - El valor actual cambia cómo se muestran los resultados; no cambia los cálculos de crecimiento, comisiones ni impuestos.
        - question: ¿Cuál es la diferencia entre crecimiento fijo y variable, y qué es la simulación Monte Carlo?
          answer:
            - El crecimiento fijo usa tus suposiciones de crecimiento anual para producir una proyección repetible que puede tener éxito o fracasar.
            - En el modo de crecimiento variable, tu escenario se ejecuta cientos de veces con variaciones aleatorias en los rendimientos de las inversiones.
            - Después, el simulador cuenta qué porcentaje de esas ejecuciones alcanzó tu edad objetivo sin quedarse sin dinero.
            - El resultado muestra la probabilidad de éxito de tu escenario bajo las condiciones que definiste.
        - question: ¿Cómo modela el simulador las acciones y los bonos?
          answer:
            - En el modo de crecimiento variable, cada año simulado tiene un entorno económico compartido (crecimiento, recesión, estancamiento) que puede persistir durante varios años, calibrado para conservar las suposiciones de crecimiento y volatilidad a largo plazo que introdujiste.
            - 'Ese entorno les afecta de forma diferente: las acciones tienden a ir mejor durante el crecimiento y peor durante las recesiones, mientras que los bonos tienden a proporcionar cierta compensación.'
            - Ambos siguen teniendo sus propios altibajos aleatorios, así que no siempre se moverán en direcciones opuestas.
        - question: ¿Qué ocurre con el efectivo sobrante y qué ocurre cuando los ingresos no cubren los gastos?
          answer:
            - Cuando los ingresos superan los gastos, el simulador primero acumula efectivo hasta tu reserva de emergencia ajustada por inflación. El efectivo por encima de ese objetivo se invierte usando los porcentajes del panel de asignaciones; si esos porcentajes suman menos del 100%, el resto permanece en efectivo.
            - Cuando los ingresos no cubren los gastos, el simulador usa efectivo e inversiones en el orden definido en el panel de prioridades de disposición.
            - Si los ingresos disponibles y los activos accesibles aún no pueden cubrir los gastos, la simulación marca el plan como fallido.
        - question: ¿Cómo hago una prueba de resistencia de mi plan?
          answer:
            - 'Prueba suposiciones económicas más duras: sube la inflación, reduce el crecimiento de las inversiones o añade eventos de caída del mercado a la cronología, y observa hasta qué punto es robusto tu plan.'
        - question: ¿Cómo encuentro los puntos débiles de mi plan?
          answer:
            - Después de una ejecución de simulación, usa el menú desplegable de combinación de colores en la tabla de datos ({icon:palette}) para resaltar periodos críticos. Los colores muestran dónde el flujo de caja se estrecha o los ahorros bajan demasiado.
            - • <b>Flujo de caja:</b> muestra los puntos de presión del flujo de caja en tu plan, cuando los ingresos no cubren los gastos y tienes que usar efectivo o vender inversiones.
            - • <b>Fallo:</b> muestra los años en los que es más probable que tu plan falle (se quede sin dinero).
            - • <b>Supervivencia:</b> muestra qué probabilidad tiene tu plan de tener éxito hasta ese momento.
        - question: ¿Cómo funcionan los eventos de traslado?
          answer:
            - Un evento de traslado cambia tu país de residencia desde un momento específico, para que el simulador pueda aplicar el modelo fiscal y las condiciones económicas del nuevo país.
            - 'Después de añadir un evento de traslado, algunos eventos pueden verse afectados y mostrar insignias de advertencia ({icon:triangle-exclamation}). Usa las sugerencias integradas para resolver los problemas: dividir eventos, mantener monedas originales, vincular eventos a un país, convertir valores, etc.'
            - Los escenarios multinacionales muestran banderas de países en las áreas de entrada para datos específicos de cada país, y pueden añadir selectores de moneda para los gráficos y la tabla de datos.
        - question: ¿Cómo funciona la conversión de moneda en gráficos y tablas?
          answer:
            - En escenarios multimoneda, puedes elegir que los gráficos y las tablas muestren monedas locales o conviertan todo a una moneda de presentación.
            - “El simulador parte de anclajes de tipo de cambio (actualizados mensualmente) y los proyecta hacia el futuro usando la inflación relativa entre países.”
            - La paridad de poder adquisitivo (PPP) se usa para sugerir valores equivalentes al resolver eventos afectados por un traslado.
        - question: ¿Por qué tendría que recuperar mi licencia?
          answer:
            - Guardas una copia de tu licencia en el almacenamiento local de tu navegador.
            - Si borras el almacenamiento de tu navegador, pierdes el acceso a tu licencia.
            - Además, si accedes a este sitio web desde otro navegador o dispositivo, no tendrá una copia de tu licencia.
            - En esos casos, usa el botón [recuperar licencia] en el menú (☰) y el sistema la restaurará buscando tu dirección de correo electrónico en mis servidores.
        - question: ¿Puedo usar mi licencia en más de un dispositivo?
          answer:
            - 'Sí: usa el botón [recuperar licencia] en el menú (☰), introduce el correo electrónico que usas con Stripe y recibirás un correo electrónico con un enlace de recuperación.'
        - question: ¿Puedo acceder a mis escenarios guardados desde otro dispositivo?
          answer:
            - Sí, pero tienes que copiar los archivos de escenario al otro dispositivo.
            - Tus escenarios guardados están solo en los dispositivos donde los guardaste. Si los pierdes, desaparecen. No tengo una copia.
  - id: notes
    title: Notas
    content:
      items:
        - title: Aviso de privacidad
          description: La información que ingresas nunca sale de tu dispositivo. Todo se procesa en tu navegador.
        - title: Uso de IA
          description: Este producto se desarrolló parcialmente con IA, por un ingeniero de software experimentado que se obsesiona con cada pequeño detalle. Pero ten en cuenta que no soy contable ni asesor financiero, ni puedo garantizar la precisión de cada número usado al modelar países reales. Los modelos fiscales incluyen aproximaciones y simplificaciones, y pueden ocurrir errores. Envíame comentarios si encuentras un problema y haré todo lo posible por corregirlo.
        - title: Descargo de responsabilidad
          description: Esto no es asesoramiento financiero, de inversión, fiscal ni legal. Es una herramienta para ayudarte a entender cómo distintas decisiones y escenarios pueden afectar tu futuro financiero a largo plazo. No tomes decisiones financieras importantes sin hablar con un asesor financiero.
