  - popover:
      description: <p>La tasa media anual de crecimiento esperada de los ingresos salariales.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada de los ingresos salariales.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada de los ingresos de RSU.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada de los ingresos de prestación definida.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada de los ingresos exentos de impuestos.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada del gasto.</p><p>Si lo dejas en blanco, usará la tasa de inflación.</p>
  - popover:
      description: <p>El porcentaje total que el mercado caerá o subirá en el periodo especificado.</p><p>Por ejemplo, para simular una caída puntocom del S&P500 cuando tienes 30 años, introducirías 30 como edad inicial, 35 como edad final y -40% como tasa (el mercado perdió alrededor de un 40% en dos años). Esto sustituirá el crecimiento del mercado que especificaste en los parámetros de economía por una caída de alrededor del 29% anual durante esos dos años. Para un mercado alcista, usarías un porcentaje de crecimiento positivo.</p><p>Ten en cuenta que los valores altos de volatilidad ya implican burbujas y caídas, pero es interesante ver qué sucede si la caída llega en el peor momento, por ejemplo [justo cuando te retiras](https://en.wikipedia.org/wiki/Retirement_spend-down){sequence risk,retirement,withdrawal,market,returns}.</p>
  - popover:
      description: <p>La tasa anual esperada de apreciación de la propiedad.</p><p>Para propiedades compradas en el pasado, puedes calcular la apreciación usando el precio de compra original y el valor de mercado actual.</p>
  - popover:
      description: <p>La tasa del préstamo hipotecario.</p><p>Puedes obtener este número de una calculadora hipotecaria en línea.</p>
  - popover:
      description: <p>Los eventos de pago anticipado de hipoteca no usan este campo.</p>
  - popover:
      description: <p>Los eventos de liquidación de hipoteca no usan este campo.</p>
  - popover:
      description: <p>La tasa de interés de la hipoteca inversa aplicada al saldo pendiente del préstamo inverso.</p>
  - popover:
      description: <p>Para eventos de salario, introduce el porcentaje de tus aportes a la pensión que igualará tu empleador.</p><p>Muchos empleadores igualan las aportes hasta cierto porcentaje de tu salario.</p>
  - popover:
      description: <p>Los eventos 'Sin operación' ignoran todos los campos.</p>
  - popover:
