GuidedSections:
  startingPosition:
    title: Posición inicial
    questions:
      planFor: ¿Para quién es este plan?
      country: ¿En qué país vives?
      ages: ¿Qué edad tienen ambos?
      startingAge: ¿Qué edad tienes?
      p2StartingAge: ¿Qué edad tiene tu pareja?
      initialSavings: ¿Aproximadamente cuánto tienes en ahorros ahora mismo? Una cifra aproximada está bien.
      pensionPots: ¿Qué hay ya en tus fondos de pensión?
      initialPension: ¿Ya tienes un fondo de pensión? ¿Aproximadamente cuánto hay en él? Déjalo en blanco si no estás seguro.
      initialPensionP2: ¿Tu pareja ya tiene un fondo de pensión? ¿Aproximadamente cuánto hay en él? Déjalo en blanco si no estás seguro.
      currentBalances: ¿Qué tienes ya invertido fuera de las pensiones?
    why:
      planFor: En muchos países las parejas tributan de forma diferente.
      country: Cada país tiene sus propias reglas fiscales y las modelamos para crear proyecciones.
      ages: Las edades fijan la cronología y determinan cada evento, tramo fiscal y regla de pensión.
      initialSavings: Tu efectivo inicial es el saldo de apertura de la simulación.
      pensionPots: Los fondos de pensión crecen libres de impuestos y se desbloquean en la jubilación. Si ya tienes un fondo, eso suma.
      currentBalances: Los saldos iniciales de inversión permiten que la primera proyección empiece desde tu cartera real.
    choices:
      justMe: Solo yo
      couple: Yo y mi pareja
  personalCircumstances:
    title: Circunstancias personales
    questions:
      marriageYear: ¿En qué año te casaste o esperas casarte? Déjalo en blanco si no aplica.
      hasChildren: ¿Tienes hijos o planeas tenerlos?
      childrenBirthYears: ¿Cuándo nacieron o nacerán tus hijos?
      oldestChildBorn: ¿En qué año nació o nacería tu hijo mayor?
      youngestChildBorn: ¿Y el menor? Omítelo si solo tienes un hijo.
    why:
      marriageYear: El matrimonio puede cambiar los créditos fiscales y los tramos a partir de ese año.
      hasChildren: Los hijos pueden afectar a los créditos fiscales y, en algunos países, a las prestaciones.
      childrenBirthYears: Los créditos fiscales y las prestaciones por tener hijos sólo duran mientras siguen siendo menores.
    choices:
      'true': Sí
      'false': 'No'
  targets:
    title: Objetivos
    questions:
      retirementAges: 'Hablemos de cuándo te gustaría retirarte:'
      retirementAge: ¿A qué edad te gustaría dejar de trabajar?
      p2RetirementAge: ¿Y tu pareja?
      targetAge: ¿Hasta cuándo debe durar el plan? Simularemos hasta esta edad.
      emergencyStash: ¿Cuánto te gustaría reservar para emergencias? Omítelo si no estás seguro.
    why:
      retirementAges: Cuándo terminan los salarios y puede empezar la disposición de la pensión. Antes significa menos años de ingresos y una disposición más larga.
      targetAge: Conviene asumir longevidad para ver si llegas a una edad avanzada sin quedarte sin dinero.
      emergencyStash: El simulador mantiene este importe en efectivo antes de invertir los excedentes.
  moneyHabits:
    title: Hábitos de dinero
    questions:
      pensionContribution: ¿Entra dinero en una pensión desde tu salario? Introduce un porcentaje del salario o elige Máx. para el máximo con desgravación fiscal. Déjalo en blanco si no estás seguro.
      pensionContributionP2: ¿Entra dinero en la pensión de tu pareja desde su salario? Introduce un porcentaje del salario o elige Máx.
      pensionContributionLabel: Tu %
      pensionContributionP2Label: '% de tu pareja'
      pensionContributionMaxNote: 'Consejo: el botón Máx. aporta el máximo que permite tu país libre de impuestos.'
      surplusDestination: Cuando queda dinero después de gastar, ¿qué suele pasar con él?
      investedShare: ¿Aproximadamente qué parte de tu dinero sobrante se invierte? Una estimación está bien.
      allocationSplit: ¿Cómo se reparte el dinero sobrante entre los tipos de inversión?
    why:
      pensionContribution: Esto afecta a los impuestos ahora y a los saldos de pensión más tarde.
      surplusDestination: Esto decide si el efectivo sobrante se mantiene líquido o tiene la oportunidad de crecer.
      investedShare: Lo repartiremos entre todos los tipos de inversión (una simplificación para avanzar, no una recomendación). Puedes hacer ajustes en el panel.
      allocationSplit: El reparto importa porque cada tipo de inversión puede tener distinto crecimiento y tratamiento fiscal.
    allocationStatus:
      cashSurplus: '{value}% se mantiene en efectivo'
      exceeded: Reduce las asignaciones en {value}% para mantenerte dentro del 100%
    choices:
      bank: Se queda en mi cuenta bancaria
      invested: Parte se invierte
  events:
    title: Tus eventos
    intro: 'Los eventos son la historia de tu vida financiera: ingresos, gastos, vivienda. Añadamos lo básico.'
    questions:
      salary: ¿Ganas un salario?
      salaryDetails: ¿Cuánto ganas y hasta cuándo?
      salaryAmount: ¿Aproximadamente cuánto al año, antes de impuestos?
      salaryUntilAge: ¿Hasta qué edad?
      salaryMatch: ¿Tu empleador también aporta a tu pensión? ¿Qué porcentaje del salario iguala? Omítelo si no hay aporte o no estás seguro.
      partnerSalary: ¿Tu pareja gana un salario?
      partnerSalaryDetails: ¿Cuánto gana tu pareja y hasta cuándo?
      partnerSalaryAmount: ¿Aproximadamente cuánto gana tu pareja al año, antes de impuestos?
      partnerSalaryUntilAge: ¿Hasta qué edad ganará un salario tu pareja?
      partnerSalaryMatch: ¿El empleador de tu pareja también aporta a su pensión? ¿Qué porcentaje del salario iguala? Omítelo si no hay aporte o no estás seguro.
      expensesRent: ¿Aproximadamente cuánto gasta tu hogar al año, sin contar el alquiler? Una cifra aproximada está bien.
      expensesMortgage: ¿Aproximadamente cuánto gasta tu hogar al año, sin contar los pagos de hipoteca? Una cifra aproximada está bien.
      expensesOwn: ¿Aproximadamente cuánto gasta tu hogar al año? Una cifra aproximada está bien.
      housing: ¿Alquilas o tienes vivienda propia?
      rent: ¿Cuál es tu alquiler mensual?
      ownOutright: Si planeas vender o comprar otra propiedad, añádela desde la tabla de eventos en cualquier momento.
      quickMortgage: ¿Cuál es tu pago actual de hipoteca y cuántos años quedan?
    why:
      housing: La vivienda suele ser el mayor coste, y una vivienda es un activo que el simulador rastrea.
      rent: La vivienda suele ser el mayor coste, y el alquiler es un gasto que el simulador rastrea.
      quickMortgage: Un pago aproximado y los años restantes bastan para modelar la hipoteca pendiente.
      salaryDetails: Tus ingresos nos ayudan a estimar los impuestos y la capacidad de ahorro.
      salaryMatch: Las aportes del empleador son dinero gratis que se capitaliza durante décadas.
      partnerSalary: Los ingresos de tu hogar nos ayudan a estimar los impuestos y la capacidad de ahorro.
      partnerSalaryDetails: Los ingresos de tu hogar nos ayudan a estimar los impuestos y la capacidad de ahorro.
      partnerSalaryMatch: Las aportes del empleador son dinero gratis que se capitaliza durante décadas.
      expenses: El gasto anual determina lo que queda para ahorrar o invertir.
    placeholders:
      salaryAmount: Importe bruto
      partnerSalaryAmount: Importe bruto
      expensesRent: Excluir alquiler
      expensesMortgage: Excluir hipoteca
    notes:
      quickMortgage: 'Asumiremos una hipoteca típica: plazo de 25 años, 20% de entrada. Puedes afinarla en cualquier momento en la tabla de eventos.'
    homeName: Vivienda
    mortgageFields:
      monthlyPayment: Pago mensual
      yearsLeft: Años restantes
      rate: Tasa de interés
    choices:
      'true': Sí
      'false': 'No'
      rent: Alquilo
      ownOutright: La tengo en propiedad sin hipoteca
      mortgage: La tengo en propiedad con hipoteca
  drawdownPriorities:
    title: Prioridades de disposición
    body:
      - Cuando tus ingresos no cubren tus gastos, necesitamos saber en qué orden retirar de tus ahorros e inversiones.
      - Este orden le indica al simulador de dónde tomar dinero cuando hay un déficit. El primero se usa antes.
    animationCaption: Puedes reordenar la lista en el siguiente panel.
    button: Revisar orden
  economy:
    title: Economía
    body:
      - Ahora asumiremos condiciones económicas neutrales (rendimientos y volatilidad).
      - Son suposiciones predeterminadas, no previsiones ni recomendaciones. Edítalas cuando quieras.
    button: Revisar suposiciones
    questions:
      inflation: ¿Qué tasa de inflación debe usar este plan?
      growthAssumptions: Confirma o edita los supuestos iniciales de crecimiento de acciones y rendimiento de bonos.
    why:
      inflation: La inflación afecta a cuánto vale el dinero futuro en términos actuales.
      growthAssumptions: Las suposiciones de crecimiento impulsan las proyecciones de inversión a largo plazo, pero no son recomendaciones.
InsightsCopy:
  icon:
    ariaLabel: Qué ocurrió en esta simulación
  panel:
    title: Hallazgos de la simulación
    footer: FinSim describe lo que muestra la simulación. Nunca da asesoramiento financiero.
    close: Cerrar
    showMe: Muéstrame esos años
    autoOpenHint: 'Consejo: después de cualquier simulación, haz clic en la ⓘ del cuadro de resultados de arriba para volver a ver estas observaciones.'
  insights:
    failure_downpayment: El plan se queda sin dinero a la edad {failAge}. Ese año, el efectivo disponible no pudo cubrir el pago inicial de {eventName}.
    failure_spike: El plan se queda sin dinero a la edad {failAge}. El gasto aumenta bruscamente ese año; el mayor coste es {sourceName}.
    failure_chronic: El plan se queda sin dinero a la edad {failAge}. Desde la edad {fromAge}, los ingresos ya no cubren los gastos, y los ahorros y las inversiones se van usando hasta agotarse.
    failure_chronic_no_buffer: El plan se queda sin dinero a la edad {failAge}. Desde la edad {fromAge}, los ingresos ya no cubren los gastos.
    downpayment_shortfall: A la edad {age}, el efectivo disponible no cubre por completo el pago inicial de {eventName}.
    cashflow_gap_det: Entre las edades {fromAge} y {toAge}, los ingresos no cubren los gastos; la diferencia sale de ahorros e inversiones. El mayor coste en esos años es {topExpense}.
    cashflow_gap_det_no_buffer: Entre las edades {fromAge} y {toAge}, los ingresos no cubren los gastos. El mayor coste en esos años es {topExpense}.
    cashflow_gap_mc: En aproximadamente el {pct}% de las trayectorias simuladas, los ingresos no alcanzan para cubrir los gastos entre las edades {fromAge} y {toAge}.
    cashflow_gap_mc_most: En casi todas las trayectorias simuladas, los ingresos no alcanzan para cubrir los gastos entre las edades {fromAge} y {toAge}.
    cashflow_gap_mc_all: En todas las trayectorias simuladas, los ingresos no alcanzan para cubrir los gastos entre las edades {fromAge} y {toAge}.
    retirement_income_drop: Los ingresos netos bajan aproximadamente un {pct}% al retirarte (edad {age}).
    pension_depleted: El fondo de pensión se agota por completo a la edad {age}.
    volatility_dependence: Con crecimiento estable este plan funciona, pero con subidas y bajadas del mercado aproximadamente el {failPct}% de las trayectorias simuladas se quedan sin dinero.
    volatility_dependence_most_fail: Con crecimiento estable este plan funciona, pero con subidas y bajadas del mercado casi todas las trayectorias simuladas se quedan sin dinero.
    volatility_dependence_all_fail: Con crecimiento estable este plan funciona, pero con subidas y bajadas del mercado todas las trayectorias simuladas se quedan sin dinero.
    mc_failure_downpayment: En aproximadamente el {pct}% de las trayectorias que fallan, el dinero se agota a la edad {age}, cuando el efectivo disponible no puede cubrir el pago inicial de {eventName}.
    mc_failure_downpayment_most: En casi todas las trayectorias que fallan, el dinero se agota a la edad {age}, cuando el efectivo disponible no puede cubrir el pago inicial de {eventName}.
    mc_failure_downpayment_all: Cuando las trayectorias simuladas fallan, el dinero se agota a la edad {age}, cuando el efectivo disponible no puede cubrir el pago inicial de {eventName}.
    mc_failure_spike: Las trayectorias que fallan suelen quedarse sin dinero alrededor de la edad {peakAge}, cuando el gasto aumenta bruscamente; el mayor coste es {sourceName}.
    mc_failure_peak: Entre las trayectorias que fallan, el dinero suele agotarse alrededor de la edad {peakAge}. Ese es el punto problemático más probable.
    mc_failure_spread: 'Los fallos no están ligados a un solo año: las trayectorias que fallan se quedan sin dinero en cualquier momento entre las edades {fromAge} y {toAge}, con los primeros casos alrededor de la edad {onsetAge}.'
    outcome_all_fail: Todas las trayectorias simuladas se quedan sin dinero; el primer fallo ocurre a la edad {worstAge}.
    outcome_most_fail: Casi todas las trayectorias simuladas se quedan sin dinero; el primer fallo ocurre a la edad {worstAge}.
    outcome_range: Aproximadamente el {failPct}% de las trayectorias simuladas se quedan sin dinero; el primer fallo ocurre a la edad {worstAge}.
    outcome_most_survive: Casi todas las trayectorias simuladas llegan a la edad {targetAge} sin quedarse sin dinero; el primer fallo ocurre a la edad {worstAge}.
    outcome_range_all_ok: Ninguna trayectoria simulada se queda sin dinero antes de la edad {targetAge}.
    all_clear: Los ingresos cubren los gastos en todos los años simulados.
