  - popover:
      description: <p>Haz clic en el icono ⇅ para mantener la tabla ordenada por cualquier columna. Haz clic una vez para orden ascendente ▲, dos veces para orden descendente ▼ y una tercera vez para dejar de ordenar.</p>
  - popover:
      description: <p>Cambia para ver los eventos como una tabla.</p><p>Esta vista es ideal para pantallas más grandes y cuando ya conoces bien estos eventos. Se parece más a una hoja de cálculo, donde ves todos los datos de un vistazo y puedes modificarlos directamente.</p>
  - popover:
      description: <p>Cambia para ver los eventos como paneles expandibles.</p><p>Esta vista es mejor para pantallas más pequeñas o cuando estás aprendiendo cómo funciona. Al expandirse, la información del evento se parece más a un formulario, con etiquetas claras que facilitan entender para qué sirve cada cosa.</p>
  - popover:
      description: '<p>Cambia para ver los puntos iniciales y finales de los eventos en términos de edad.</p><p>En modo de una persona, todos los eventos serán relativos a tu edad. En modo de dos personas, algunos eventos se referirán a la edad de la otra persona (por ejemplo, sus ingresos salariales). Puedes comprobar qué año representa cambiando al modo Año, o pasando el cursor sobre un campo de edad: aparecerá una ayuda emergente con el año correspondiente.</p>'
  - popover:
      description: <p>Cambia para ver los puntos iniciales y finales de los eventos en términos de año.</p><p>En este modo, para ver la edad que corresponde a un año determinado, pasa el cursor sobre un campo de año. Aparecerá una ayuda emergente con la edad correspondiente, que puede ser tu edad o la de la otra persona según el tipo de evento y si estás en modo de una persona o de dos personas.</p>
  - popover:
      description: '<p>Tus proyecciones financieras a lo largo del tiempo.</p><ul><li><strong>Flujo de caja</strong>: ingresos y gastos por categoría, con una línea para tu flujo de caja neto y otra para tus gastos totales.</li><li><strong>Activos</strong>: crecimiento del patrimonio y distribución entre distintos tipos de activos.</li></ul>'
  - popover:
      description: <p><strong>El flujo de caja</strong> es el dinero que entra y sale de tu hogar cada año. Si entra más de lo que sale, puedes ahorrar o invertir la diferencia; si entra menos, debes cubrir la diferencia con tus activos.</p><p>Este gráfico desglosa tus ingresos y compara las entradas totales con las salidas totales a lo largo del tiempo.</p><p>En escenarios con múltiples monedas, la visualización unificada convierte los importes usando el modelo FX del simulador. Pasa el cursor sobre los puntos de datos para ver los valores en la moneda original.</p>
  - popover:
      description: <p><strong>Los activos</strong> son cosas que posees y que tienen valor financiero, como efectivo, inversiones, pensiones e inmuebles. A diferencia del flujo de caja, que mide el dinero que se mueve durante un año, los activos muestran lo que has acumulado en cada momento.</p><p>Este gráfico muestra cómo se prevé que cambien el valor y la composición de tus activos a lo largo del tiempo.</p><p>En escenarios con múltiples monedas, la visualización unificada convierte los importes usando el modelo FX del simulador. Pasa el cursor sobre los puntos de datos para ver los valores en la moneda original.</p>
  - popover:
      description: <p>Los números reales año a año tal como los calcula el simulador, desde tu edad actual hasta la edad final.</p><p>En pantallas más pequeñas la tabla está oculta, pero puedes tocar 'Mostrar de todos modos' para verla.</p><p>Puedes pasar el cursor, hacer clic o tocar cualquier celda con una pequeña 'i' para obtener una ayuda emergente con información más detallada.</p><p>En escenarios con múltiples monedas, la visualización unificada convierte los importes usando el modelo FX del simulador.</p>
  - popover:
      description: <p>Cambia el esquema de colores usado para resaltar las filas de la tabla de datos.</p><p>Los distintos esquemas de colores te ayudan a visualizar diferentes aspectos de tu plan financiero, como patrones de flujo de caja y posibles áreas problemáticas. Los colores se aplican a las filas de la tabla según los datos financieros de ese año. Para obtener más información sobre cada esquema de colores, haz clic en el icono y pasa el cursor sobre el nombre de cada esquema de colores.</p>
  - popover:
      description: <p>Exporta la tabla de datos de la simulación como archivo CSV.</p><p>Esto te permite guardar los datos financieros detallados año a año para analizarlos en aplicaciones de hoja de cálculo como Excel o Google Sheets.</p>
  - popover:
      title: Recorrido completado
      description: |
        <p><b>¡Felicidades!</b> Has completado el recorrido de FinSimLab.</p> <p>Recuerda que siempre puedes obtener ayuda si tienes dudas al rellenar un campo haciendo clic en Ayuda o pulsando la tecla ?.</p> <p><b>¡Feliz planificación!</b> 🎯</p>
      demoEpilogue: |
        <p>Has estado explorando un plan de ejemplo. Usa Nuevo cuando estés listo para empezar el tuyo.</p>
      prevBtnText: Atrás
      nextBtnText: Listo
