  - popover:
      description: <p>Indica hasta qué {{age_or_year}}, inclusive, se mantiene la propiedad.</p><p>El valor total de la propiedad se calculará incluyendo los pagos de la hipoteca más la apreciación esperada, y se venderá después del valor que introduzcas aquí para {{age_or_year}}. Los ingresos se invertirán según la asignación que hayas elegido o se usarán para comprar otra propiedad el año siguiente.</p>
