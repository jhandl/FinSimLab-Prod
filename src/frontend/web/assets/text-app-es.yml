  - popover:
      content:
        text: Aquí describes tu situación financiera actual. Es el punto de partida de la simulación.
  - popover:
      description: <p>Modo individual.</p><p>Usa este modo para la planificación financiera individual. En este modo, solo introducirás tu propia información financiera y el simulador planificará el futuro financiero de una persona.</p>
  - popover:
      description: <p>Modo pareja.</p><p>Esto te permite introducir fondos de pensión, edades de jubilación e información de pensión separados para una pareja.</p><p>Los eventos de ingresos pueden asignarse a cualquiera de las dos personas.</p>
  - popover:
      description: <p>Selecciona tu país de residencia actual.</p><p>Esto establece el modelo fiscal activo para los cálculos. Puedes añadir un evento de traslado para mudarte a otro país (si está disponible), y entonces se aplicará el modelo fiscal de ese país.</p>
  - popover:
      description: <p>Introduce tu edad actual.</p>
  - popover:
      description: <p>Introduce la edad actual de tu pareja.</p>
  - popover:
      description: <p>Introduce tus ahorros actuales.</p><p>Cualquier efectivo que tengas en tus cuentas bancarias o caja fuerte (o colchón), sin generar intereses significativos. En modo de dos personas, esto representa los ahorros combinados de ambas personas.</p>
  - popover:
      description: <p>El importe total en tus fondos de pensión privada.</p><p>Si aún no has aportado a uno, introduce '0' o déjalo en blanco. Si tienes más de un fondo de pensión, introduce aquí el importe total.</p>
  - popover:
      description: <p>El importe total en los fondos de pensión privada de tu pareja.</p><p>Si tu pareja aún no ha aportado a una pensión, introduce '0' o déjalo en blanco.</p>
  - popover:
      description: <p>El valor actual de tus inversiones en ${investmentType.label}, si tienes alguna.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>Describe aquí tus circunstancias personales, ya que afectan a tus cálculos fiscales durante toda la simulación. Esto incluye datos actuales o planes futuros de matrimonio/unión civil e hijos, que pueden influir en los tramos y créditos fiscales.</p>
  - popover:
      description: <p>El año en que te casaste o formaste una unión civil, o en que planeas hacerlo (déjalo vacío si no aplica).</p><p>Los límites de tus tramos de impuesto sobre la renta pueden cambiar si estás casado o en una unión civil.</p>
  - popover:
      description: <p>El año en que nació tu hijo mayor, o en que se espera o se especula que nazca (déjalo vacío si no planeas tener hijos).</p><p>Los límites de tus tramos de impuesto sobre la renta pueden aumentar si tienes hijos dependientes, a partir del nacimiento de tu primer hijo.</p>
  - popover:
      description: <p>El año en que nació tu hijo menor, o en que se espera o se especula que nazca (déjalo vacío si no planeas tener hijos).</p><p>El aumento de los límites de tus tramos de impuesto sobre la renta por hijos dependientes puede continuar hasta que tu hijo menor tenga más de ${taxRules.incomeTax.dependentChildMaxAge} años.</p>
  - popover:
      description: <p>El importe del crédito fiscal personal al que tienes derecho según tus circunstancias personales (viudez, persona cuidadora, etc.).</p><p>Esto es independiente de los créditos fiscales relacionados con el empleo y no incluye a los hijos dependientes.</p><p>Usa [este recurso fiscal oficial](${taxRules.helpResources.personalTaxInputs.url}) para calcular el importe.</p>
  - popover:
      description: ${taxRules.pensionRules.helpText.statePensionDescriptionP1}
  - popover:
      description: ${taxRules.pensionRules.helpText.statePensionDescriptionP2}
  - popover:
      description: <p>Aquí describes lo que quieres conseguir.</p>
  - popover:
      description: <p>La edad a la que planeas retirarte.</p>
  - popover:
      description: <p>La edad a la que tu pareja planea retirarse.</p>
  - popover:
      description: <p>Esta es tu esperanza de vida.</p><p>La simulación terminará a esta edad y será correcta si alcanzas esta edad sin quedarte sin dinero.</p>
  - popover:
      description: <p>El importe de dinero que planeas tener en efectivo para cubrir gastos imprevistos.</p><p>Se ajustará por inflación.</p>
  - popover:
      description: <p>Aquí decides cuánto asignar a cada tipo de inversión.</p>
  - popover:
      description: <p>El porcentaje de tu cartera que planeas asignar a ${investmentType.label}.</p><p>${investmentType.helpText}</p><p>Todo el efectivo restante después de financiar tu reserva de emergencia se invertirá según estas proporciones. Si suman menos del 100%, ahorrarás el resto en efectivo.</p>
  - popover:
      description: <p>Selecciona en qué instrumento global invierte <b>${investmentType.label}</b>.</p><p>Usa <b>Mezcla...</b> para dividir entre dos instrumentos a lo largo del tiempo (mezcla fija o trayectoria de asignación).</p>
  - popover:
      description: '<p>La comisión anual que cobra tu banco o bróker por mantener tus inversiones. Valor predeterminado: ${investmentType.defaultFeeText}.</p>'
  - popover:
      description: <p>Selecciona en qué instrumento global se invierten tus aportes a pensión privada.</p><p>Usa <b>Mezcla...</b> para dividir entre dos instrumentos a lo largo del tiempo (mezcla fija o trayectoria de asignación).</p>
  - popover:
      description: <p>Selecciona en qué instrumento global se invierten las aportes a pensión privada de tu pareja.</p><p>Usa <b>Mezcla...</b> para dividir entre dos instrumentos a lo largo del tiempo (mezcla fija o trayectoria de asignación).</p>
  - popover:
      description: '<p>La comisión anual que cobra tu proveedor de pensión por mantener tu pensión. Valor predeterminado: ${investmentType.defaultFeeText}.</p>'
  - popover:
      description: '<p>La comisión anual que cobra el proveedor de pensión de tu pareja por mantener su pensión. Valor predeterminado: ${investmentType.defaultFeeText}.</p>'
  - popover:
      description: ${investmentType.contributionDescriptionP1}
  - popover:
      description: ${investmentType.contributionDescriptionP2}
  - popover:
      description: '<p>Límite de tu aporte a la pensión. La desgravación fiscal solo se aplica hasta el límite anual definido en el modelo fiscal actual.<ul><li><b>Sí</b>: detenerse en el límite de ${taxRules.pensionRules.contributionLimits.annualCap,currency} (ajustado por inflación).</li><li><b>No</b>: pagar impuestos sobre los importes que superen el límite de ${taxRules.pensionRules.contributionLimits.annualCap,currency}.</li><li><b>Igualar</b>: aportar solo lo que tu empleador iguale (p. ej., 4% tú + 4% empleador).</li></ul></p>'
  - popover:
      description: <p>Define el orden de retiro de tus activos:</p><ul><li>Arrastra elementos para reordenarlos; arriba = se usa primero.</li><li>Las prioridades importan al cubrir gastos cuando los ingresos no son suficientes (p. ej., retiros durante la etapa de jubilación).</li></ul>
  - popover:
      description: <p>Aquí estimas cómo se comportará la economía en promedio en el futuro.</p><p>Usa el selector de la parte superior derecha para cambiar entre modos de crecimiento fijo y variable.</p><p>Puede que quieras introducir cifras de crecimiento conservadoras para poner a prueba tu escenario.</p>
  - popover:
      description: <p>Modo de crecimiento fijo.</p><p>En este modo, la simulación usa tasas de crecimiento fijas sin volatilidad. Esto ofrece un único resultado predecible según las tasas de crecimiento que hayas especificado. Los campos de volatilidad están ocultos en este modo.</p>
  - popover:
      description: <p>Modo de crecimiento variable.</p><p>En este modo, el simulador se ejecuta cientos de veces con tasas de crecimiento variables según la volatilidad que especifiques. Esto ofrece una probabilidad de éxito en lugar de un único resultado, teniendo en cuenta la incertidumbre y las fluctuaciones del mercado. Al menos una de las tasas de volatilidad debe ser superior al 0%.</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada de <b>${investmentType.label}</b>, independiente de la inflación.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>La desviación estándar esperada de la tasa anual de crecimiento de <b>${investmentType.label}</b>.</p><p>Este campo solo se usa en el modo de simulación con tasa variable.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>La tasa media anual de crecimiento esperada de <b>${investmentType.label}</b>, independiente de la inflación.</p><p>${investmentType.helpText}</p>
  - popover:
      description: <p>La desviación estándar esperada de la tasa anual de crecimiento de <b>${investmentType.label}</b>.</p><p>Este campo solo se usa en el modo de simulación con tasa variable.</p><p>${investmentType.helpText}</p>
  - defaultTooltip: La tasa de inflación predeterminada [para ${countryName}] basada en 20 años de datos históricos y previsión a corto plazo.
    popover:
      description: '<p>La tasa media anual de inflación esperada.</p><p>Los bancos centrales en economías estables aspiran a una tasa de inflación del 2% al 3% anual. Sin embargo, las desviaciones debidas a perturbaciones (p. ej., pandemias, guerras, etc.) se inclinan hacia cifras más altas.</p><p>Consejo: activa el selector de valor actual en el menú (☰) para ver todos los valores proyectados ajustados a términos monetarios actuales, lo que facilita entender el poder adquisitivo real a lo largo de los años.</p>'
  - popover:
      description: <p>Añade, quita y edita los eventos que componen tu escenario.</p><ul><li>Un evento es cualquier cosa limitada en el tiempo y con impacto financiero, como ingresos, gastos o una caída del mercado.</li><li>Selecciona un tipo de evento y pulsa Ayuda o la tecla ? para ver los detalles.</li><li>Puedes usar el asistente de eventos para ayudarte a crear eventos y cambiar entre la vista de tabla y la vista de tarjetas.</li><li>Ordena ⇅ la tabla haciendo clic en un encabezado de columna.</li></ul>
  - popover:
      description: <p>Haz clic en este botón para abrir el asistente de eventos y ayudarte a completar un evento vacío.</p>
  - popover:
      description: '<p>Elige qué tipo de evento representa esta fila: ingresos, gasto, propiedad, caída del mercado, etc. Los demás campos se adaptarán automáticamente a tu selección.</p>'
  - popover:
      description: <p>El evento 'Sin operación' es una forma de silenciar un evento sin eliminarlo.</p><p>Si lo seleccionas, la simulación no usará el evento.</p>
  - popover:
      description: <p>Tu salario bruto.</p><p>Este ingreso puede aportar a tu pensión privada según tu porcentaje de aporte a la pensión.</p>
  - popover:
      description: <p>Un ingreso salarial bruto que no aporta a tu pensión.</p><p>Esto es útil para modelar ingresos salariales que no cumplen los requisitos para aportes a la pensión, o en países donde no hay un sistema de pensión privada.</p>
  - popover:
      description: <p>Un ingreso salarial bruto para tu pareja.</p><p>Este ingreso puede aportar a la pensión privada de tu pareja según su porcentaje de aporte a la pensión.</p>
  - popover:
      description: <p>Un ingreso salarial bruto para tu pareja que no aporta a su pensión.</p><p>Esto es útil para modelar ingresos salariales que no cumplen los requisitos para aportes a la pensión, o en países donde no hay un sistema de pensión privada.</p>
  - popover:
      description: <p>El valor bruto anual de las unidades de acciones restringidas a medida que se consolidan, proporcionadas por algunos empleadores como parte del paquete de remuneración.</p>
  - popover:
      description: <p>Los ingresos brutos por alquiler de una propiedad vinculada.</p>
  - popover:
      description: <p>Un plan de pensión ocupacional que proporciona ingresos fijos durante la jubilación.</p>
  - popover:
      description: <p>Este evento te permite añadir ingresos netos de cosas como una donación o una herencia.</p><p>Asume que cualquier impuesto ya se ha pagado, así que es una especie de evento flexible que te permite inyectar dinero en tu flujo de ingresos.</p>
  - popover:
      description: <p>Un gasto. Puedes añadir un evento de gasto para tu coste total anual de vida, y otros para gastos transitorios o puntuales como matrícula universitaria, un coche, etc.</p>
  - popover:
      description: <p>Una caída o burbuja del mercado bursátil. Con este evento puedes ver cómo se comporta tu plan en situaciones adversas.</p>
  - popover:
