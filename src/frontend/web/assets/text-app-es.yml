  - popover:
      description: <p>El porcentaje hasta el cual el empleador de tu pareja igualará sus aportes a la pensión privada.</p><p>Muchos empleadores igualan las aportes hasta un cierto porcentaje del salario de tu pareja. Si aporta menos que eso, su empleador solo igualará hasta ese importe. Si su empleador no ofrece esto, déjalo en blanco o introduce 0.</p>
  - popover:
